plugins {
    id 'ir.daneshrefah.scm.java-library-conventions'
    id 'maven-publish'
    id 'java'
}

publishing {
    publications {
        maven(MavenPublication) {
            groupId = 'ir.daneshrefah.scm.cache'
            artifactId = 'scm-cache-client'
            version = '1.0.0-SNAPSHOT'

            from components.java
        }
    }
}
//group = 'ir.daneshrefah.scm.cache'
//version = '0.0.1-SNAPSHOT'

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
        api 'com.hazelcast:hazelcast-spring:5.4.0'
    implementation 'com.ibm.db2.jcc:db2jcc:db2jcc4'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok:1.18.28'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
             groupId = 'ir.daneshrefah.scm.cache'
             artifactId = 'scm-cache-client'
            version = '1.0.0-SNAPSHOT'
        }
    }
}