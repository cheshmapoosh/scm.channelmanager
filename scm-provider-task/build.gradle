plugins {
    id 'ir.daneshrefah.scm.java-library-conventions'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.apache.camel:camel-core'
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    compileOnly 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-autoconfigure'
    implementation 'org.springframework:spring-context'
    compileOnly project(':scm-uaa-common')
    api project(':scm-common')
    compileOnly project(':scm-common-data')
    compileOnly project(':scm-common-error')
    compileOnly project(':scm-cache-starter')
    api project(':scm-plugin-api')
    compileOnly project(':scm-otp-client')
    implementation 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.mapstruct:mapstruct'
    annotationProcessor 'org.mapstruct:mapstruct-processor'

}
