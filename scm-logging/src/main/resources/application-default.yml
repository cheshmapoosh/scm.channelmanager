spring:
  application:
    name: Logging-server
  cloud:
    config:
      enabled: false
  jpa:
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 9090
scm:
  log:
    transactionLogConverter:
      enabled: true
      versionRequirement: '>=7.20.0'
    logTraceConverter:
      enabled: true
      versionRequirement: '>=8.0.0'
    chunkSize: 27128
    logSchedulerThreadPool:
       corePoolSize: 5
       maxPoolSize: 5
       fixedRate: 5000

  jms:
    log:
      destination: SCM2LOG
      queueManager: CSQ1
      channel: DEV.ADMIN.SVRCONN
      host: 10.10.4.238
      port: 11414
      username: admin
      password: passw0rd
  cache:
    client:
      distributed: true
      config:
        cluster-name: dev3
        network-config:
          addresses:
            - 10.10.4.125:5701
  datasource:
    transactionLog:
      enabled: true
      url: jdbc:db2://10.15.27.82:446/DSNALOC
      username: casadm
      password: a
      driver-class-name: com.ibm.db2.jcc.DB2Driver
      max-connection: 10
      default-schema: REF
    logTrace:
      enabled: true
      url: jdbc:db2://10.15.27.82:546/DSNBLOC
      username: casadm
      password: a
      driver-class-name: com.ibm.db2.jcc.DB2Driver
      max-connection: 10
      default-schema: REF