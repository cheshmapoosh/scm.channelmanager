/*
 * This file was generated by the Gradle 'init' task.
 *
 * This project uses @Incubating APIs which are subject to change.
 */

plugins {
    id 'ir.daneshrefah.scm.java-library-conventions'
    id 'java'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

bootJar {
    enabled = true
    version = parent.version
}

compileJava.options.encoding = 'UTF-8'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named("bootJar") {
    mainClass = 'ir.daneshrefah.scm.log.LoggingServerApplication'
    archiveClassifier = ''
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'jakarta.servlet:jakarta.servlet-api'
    implementation 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    runtimeOnly 'com.ibm.db2:db2jcc'
    runtimeOnly 'com.ibm.db2:db2jcc_license_cisuz'
    runtimeOnly 'com.ibm.db2.jcc:db2jcc:db2jcc4'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    implementation 'commons-io:commons-io:2.18.0'
    api project(':scm-logging-client')
    api project(':scm-message-queue')
    api project(':scm-common-data')
    api project(':scm-common')
    api project(':scm-utils')
}


