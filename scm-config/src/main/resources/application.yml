spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  application:
    name: ${SCM_APPLICATION_NAME:scm-config}
  security:
    user:
      name: ${SCM_CONFIG_ADMIN_USERNAME:admin}
      password: ${SCM_CONFIG_ADMIN_PASSWORD:${SCM_CONFIG_PASSWORD}}
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false
      server:
        git:
          uri: ${SCM_CONFIG_REPO_URI:/mnt/config-repo-server}
          search-paths: ${SCM_CONFIG_REPO_SEARCH_PATHS}
          clone-on-start: ${SCM_CONFIG_REPO_CLONE_ON_START:true}
          default-label: ${SCM_CONFIG_REPO_BRANCH:master}
          basedir: ${SCM_CONFIG_REPO_BASEDIR:/app/config-repo}
          username: ${SCM_CONFIG_REPO_USERNAME:}
          password: ${SCM_CONFIG_REPO_PASSWORD:}
        native:
          search-locations: ${SCM_CONFIG_NATIVE_SEARCH_LOCATIONS:file:/mnt/config-repo-server}
        encrypt:
          enabled: ${SCM_CONFIG_ENCRYPT_ENABLED:true}
        prefix: ${SCM_CONFIG_SERVER_PREFIX:/config}

server:
  port: ${SCM_CONFIG_SERVER_PORT:${SERVER_PORT:8888}}

management:
  endpoints:
    web:
      exposure:
        include: ${SCM_MANAGEMENT_ENDPOINTS_INCLUDE:health,info,metrics,prometheus}
  endpoint:
    health:
      show-details: ${SCM_MANAGEMENT_HEALTH_SHOW_DETAILS:never}
      probes:
        enabled: ${SCM_MANAGEMENT_HEALTH_PROBES_ENABLED:true}

logging:
  config: ${SCM_LOGBACK_CONFIG:classpath:logback-spring.xml}
  file:
    path: ${SCM_CONFIG_LOG_PATH:/mnt/log}
  level:
    root: ${SCM_LOG_LEVEL_ROOT:INFO}
    ir.daneshrefah: ${SCM_LOG_LEVEL_APPLICATION:INFO}
    org.springframework: ${SCM_LOG_LEVEL_SPRING:INFO}

scm:
  env: ${SCM_ENV:${spring.profiles.active}}
  instance-id: ${SCM_INSTANCE_ID:${HOSTNAME:local-scm-config}}

  deployment:
    service-version: ${SCM_SERVICE_VERSION:${VERSION:8.6.0}}

  application:
    version: ${SCM_APPLICATION_VERSION:${VERSION:8.6.0}}
    build: ${SCM_APPLICATION_BUILD:unknown}

  runtime: ${SCM_RUNTIME:standalone}

  observation:
    enabled: ${SCM_OBS_ENABLED:true}
    platform: ${SCM_OBS_PLATFORM:scm}
    app-name: ${SCM_OBS_APP_NAME:${spring.application.name}}
    app-label: ${SCM_OBS_APP_LABEL:${spring.profiles.active:dev}}
    instance-id: ${SCM_INSTANCE_ID:${HOSTNAME:local-scm-config}}
    time-zone: ${SCM_OBS_TIME_ZONE:UTC}
    http:
      server:
        span-name: ${SCM_OBS_HTTP_SERVER_SPAN_NAME:config.http.request}
    log:
      enabled: ${SCM_OBS_LOG_ENABLED:true}
      console:
        enabled: ${SCM_OBS_LOG_CONSOLE_ENABLED:true}
        format: ${SCM_OBS_LOG_CONSOLE_FORMAT:simple}
      file:
        enabled: ${SCM_OBS_LOG_FILE_ENABLED:true}
        format: ${SCM_OBS_LOG_FILE_FORMAT:jsonl}
        directory: ${SCM_OBS_LOG_DIR:${SCM_OBS_ROOT_DIR:${user.home}/scm/obs}/log}
        file-name: ${SCM_OBS_LOG_FILE_NAME:${spring.application.name}.jsonl}
        archive-directory: ${SCM_OBS_LOG_ARCHIVE_DIR:${SCM_OBS_ROOT_DIR:${user.home}/scm/obs}/log/archive}
      rolling:
        max-file-size: ${SCM_OBS_LOG_MAX_FILE_SIZE:100MB}
        max-history: ${SCM_OBS_LOG_MAX_HISTORY:30}
        total-size-cap: ${SCM_OBS_LOG_TOTAL_SIZE_CAP:10GB}
        clean-history-on-start: ${SCM_OBS_LOG_CLEAN_HISTORY_ON_START:false}
      level:
        root: ${SCM_LOG_LEVEL_ROOT:INFO}
        application: ${SCM_LOG_LEVEL_APPLICATION:INFO}
        spring: ${SCM_LOG_LEVEL_SPRING:INFO}
        hibernate: ${SCM_LOG_LEVEL_HIBERNATE:WARN}
        hazelcast: ${SCM_LOG_LEVEL_HAZELCAST:INFO}
    trace:
      enabled: ${SCM_OBS_TRACE_ENABLED:true}
      file:
        enabled: ${SCM_OBS_TRACE_FILE_ENABLED:true}
        format: ${SCM_OBS_TRACE_FILE_FORMAT:jsonl}
        directory: ${SCM_OBS_TRACE_DIR:${SCM_OBS_ROOT_DIR:${user.home}/scm/obs}/trace}
        file-name: ${SCM_OBS_TRACE_FILE_NAME:${spring.application.name}-trace.jsonl}
        archive-directory: ${SCM_OBS_TRACE_ARCHIVE_DIR:${SCM_OBS_ROOT_DIR:${user.home}/scm/obs}/trace/archive}
      rolling:
        max-file-size: ${SCM_OBS_TRACE_MAX_FILE_SIZE:100MB}
        max-history: ${SCM_OBS_TRACE_MAX_HISTORY:30}
        total-size-cap: ${SCM_OBS_TRACE_TOTAL_SIZE_CAP:10GB}
        clean-history-on-start: ${SCM_OBS_TRACE_CLEAN_HISTORY_ON_START:false}
      async:
        enabled: ${SCM_OBS_TRACE_ASYNC_ENABLED:false}
        queue-size: ${SCM_OBS_TRACE_ASYNC_QUEUE_SIZE:8192}
        discarding-threshold: ${SCM_OBS_TRACE_ASYNC_DISCARDING_THRESHOLD:0}
        never-block: ${SCM_OBS_TRACE_ASYNC_NEVER_BLOCK:false}
        max-flush-time: ${SCM_OBS_TRACE_ASYNC_MAX_FLUSH_TIME:1000}
    audit:
      enabled: ${SCM_OBS_AUDIT_ENABLED:false}
      file:
        enabled: ${SCM_OBS_AUDIT_FILE_ENABLED:true}
        format: ${SCM_OBS_AUDIT_FILE_FORMAT:jsonl}
        directory: ${SCM_OBS_AUDIT_DIR:${SCM_OBS_ROOT_DIR:${user.home}/scm/obs}/audit}
        file-name: ${SCM_OBS_AUDIT_FILE_NAME:${spring.application.name}-audit.jsonl}
        archive-directory: ${SCM_OBS_AUDIT_ARCHIVE_DIR:${SCM_OBS_ROOT_DIR:${user.home}/scm/obs}/audit/archive}
      rolling:
        max-file-size: ${SCM_OBS_AUDIT_MAX_FILE_SIZE:100MB}
        max-history: ${SCM_OBS_AUDIT_MAX_HISTORY:90}
        total-size-cap: ${SCM_OBS_AUDIT_TOTAL_SIZE_CAP:20GB}
        clean-history-on-start: ${SCM_OBS_AUDIT_CLEAN_HISTORY_ON_START:false}
      async:
        enabled: ${SCM_OBS_AUDIT_ASYNC_ENABLED:false}
        queue-size: ${SCM_OBS_AUDIT_ASYNC_QUEUE_SIZE:8192}
        discarding-threshold: ${SCM_OBS_AUDIT_ASYNC_DISCARDING_THRESHOLD:0}
        never-block: ${SCM_OBS_AUDIT_ASYNC_NEVER_BLOCK:false}
        max-flush-time: ${SCM_OBS_AUDIT_ASYNC_MAX_FLUSH_TIME:1000}
    metric:
      enabled: ${SCM_OBS_METRIC_ENABLED:true}

  config:
    applications:
      scm-web: ${SCM_CONFIG_APPLICATIONS_SCM_WEB:dev, test, pilot, prod}
      scm-cache: ${SCM_CONFIG_APPLICATIONS_SCM_CACHE:dev, test, pilot, prod}
      scm-uaa: ${SCM_CONFIG_APPLICATIONS_SCM_UAA:dev, test, pilot, prod}
      scm-logging: ${SCM_CONFIG_APPLICATIONS_SCM_LOGGING:dev, test, pilot, prod}
      scm-cm-connector: ${SCM_CONFIG_APPLICATIONS_SCM_CM_CONNECTOR:dev, test, pilot, prod}
    scm-user:
      name: ${SCM_CONFIG_USERNAME:scm}
      pass: ${SCM_CONFIG_PASSWORD}
    cfg-user:
      name: ${SCM_CONFIG_CFG_USERNAME:cfg}
      pass: ${SCM_CONFIG_CFG_PASSWORD:${SCM_CONFIG_PASSWORD}}
    opr-user:
      name: ${SCM_CONFIG_OPR_USERNAME:opr}
      pass: ${SCM_CONFIG_OPR_PASSWORD:${SCM_CONFIG_PASSWORD}}

encrypt:
  key: ${SCM_CONFIG_ENCRYPT_KEY}
