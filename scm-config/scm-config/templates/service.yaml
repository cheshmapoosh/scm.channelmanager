apiVersion: v1
kind: Service
metadata:
  name: {{ include "scm-config.fullname" . }}
  labels:
    {{- include "scm-config.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  {{- with .Values.service.externalIPs }}
  externalIPs:
    {{- toYaml . | nindent 4}}
  {{- end }}

  selector:
    {{- include "scm-config.selectorLabels" . | nindent 4 }}
