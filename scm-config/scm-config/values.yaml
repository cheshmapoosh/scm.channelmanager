# Default values for scm-config.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: reg.daneshrefah.ir/modern-banking/scm-app
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""

imagePullSecrets:
  - name: regcred
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "scm-config"

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: LoadBalancer
  port: 8888
  externalIPs:
    - 10.10.4.121

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: scm-config.daneshrefah.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

#livenessProbe:
#  httpGet:
#    path: /
#    port: http
#readinessProbe:
#  httpGet:
#    path: /
#    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes:
  - name: log-volume
    hostPath:
      path: /log
      type: DirectoryOrCreate
  - name: config-repo-server-volume
    hostPath:
      path: /config-repo-server
      type: DirectoryOrCreate

# Additional volumeMounts on the output Deployment definition.
volumeMounts:
  - name: log-volume
    mountPath: "/mnt/log"
  - name: config-repo-server-volume
    mountPath: "/mnt/config-repo-server"

nodeSelector:
  app: scm-config

tolerations:
  - key: "daneshrefah.ir/group"
    operator: "Equal"
    value: "scm"
    effect: "NoSchedule"

affinity: {}

env:
  - name: SPRING_PROFILES_ACTIVE
    value: dev
  - name: SPRING_APPLICATION_NAME
    value: scm-config
  - name: VERSION
    value: 8.3.0
  - name: SERVER_PORT
    value: "8888"
