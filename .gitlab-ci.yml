stages:
  - build
  - docker
  - push

variables:
  REGISTRY_URL: "reg.daneshrefah.ir/modern-banking"
  IMAGE_NAME: "scm-app"
  KUBE_NAMESPACE: "scm"

  GRADLE_VERSION: "8.14"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"
  LOCAL_GRADLE_HOME: "$CI_PROJECT_DIR/.gradle/gradle-home"

build_jars:
  stage: build
  only:
    - tags
  image: reg.daneshrefah.ir/modern-banking/scm-ci:alpine-jdk21-gradle-docker

  cache:
    key: gradle-cache
    policy: pull-push
    paths:
      - .gradle/caches
      - .gradle/wrapper
      - .gradle/gradle-home

  before_script:
    - |
      set -e
  
      if [ -x "$LOCAL_GRADLE_HOME/bin/gradle" ]; then
        echo "Using cached Gradle from $LOCAL_GRADLE_HOME"
  
      elif command -v gradle >/dev/null 2>&1; then
        echo "Using system Gradle"
        SOURCE_GRADLE_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v gradle)")")")"
        rm -rf "$LOCAL_GRADLE_HOME"
        mkdir -p "$(dirname "$LOCAL_GRADLE_HOME")"
        cp -a "$SOURCE_GRADLE_HOME" "$LOCAL_GRADLE_HOME"
  
      else
        echo "Gradle not found. Downloading Gradle $GRADLE_VERSION..."
        mkdir -p "$GRADLE_USER_HOME"
  
        wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -O "$GRADLE_USER_HOME/gradle.zip"
        unzip -q "$GRADLE_USER_HOME/gradle.zip" -d "$GRADLE_USER_HOME"
  
        rm -rf "$LOCAL_GRADLE_HOME"
        mv "$GRADLE_USER_HOME/gradle-${GRADLE_VERSION}" "$LOCAL_GRADLE_HOME"
        rm -f "$GRADLE_USER_HOME/gradle.zip"
      fi
  
      "$LOCAL_GRADLE_HOME/bin/gradle" --version
  script:
    - '"$LOCAL_GRADLE_HOME/bin/gradle" clean :scm-config:bootJar :scm-cache:bootJar :scm-uaa:bootJar :scm-web:bootJar :scm-logging:bootJar --parallel --max-workers=4 -x test'
  artifacts:
    paths:
      - "**/build/libs/*.jar"
    expire_in: 1 hour

docker_build:
  stage: docker
  tags:
    - docker
  only:
    - tags
  image: reg.daneshrefah.ir/modern-banking/scm-ci:alpine-jdk21-gradle-docker
  services:
    - docker:29-dind

  needs:
    - job: build_jars
      artifacts: true
  variables:
    DOCKER_TLS_CERTDIR: ""

  before_script:
    - docker login $CI_REGISTRY -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD

  script:
    - export VERSION=$(echo "$CI_COMMIT_TAG" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')

    - echo "Building Single Image VERSION=$VERSION"

    - docker build --build-arg VERSION=$VERSION --build-arg SPRING_APPLICATION_NAME=scm-web -t $REGISTRY_URL/$IMAGE_NAME:$VERSION .

    - mkdir images
    - docker save $REGISTRY_URL/$IMAGE_NAME:$VERSION -o images/scm-app-$VERSION.tar

  artifacts:
    paths:
      - images/scm-app-*.tar
    expire_in: 1 days

docker_push:
  stage: push
  tags:
    - docker
  only:
    refs:
      - tags
    variables:
      - $CI_COMMIT_TAG =~ /_push$/
  image: reg.daneshrefah.ir/modern-banking/scm-ci:alpine-jdk21-gradle-docker
  services:
    - docker:29-dind

  needs:
    - job: docker_build
      artifacts: true
  variables:
    DOCKER_TLS_CERTDIR: ""

  before_script:
    - docker login $CI_REGISTRY -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD

  script:
    - export VERSION=$(echo "$CI_COMMIT_TAG" | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+')
    - echo "Pushing Single Image VERSION=$VERSION"
    - docker load -i images/scm-app-$VERSION.tar
    - docker push $REGISTRY_URL/$IMAGE_NAME:$VERSION


