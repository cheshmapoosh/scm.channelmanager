stages:
  - build
  - deploy

build:
  stage: build
  script:
    - ./gradlew build

deploy:
  stage: deploy
  script:
    - pkill -f scm-web.jar
    - current_date=$(date +\%Y\%m\%d)
    - mv /home/pwausr/scm-web.jar /home/pwausr/scm-web-$current_date.jar
    - scp -o StrictHostKeyChecking=no -P 2022 scm-web/build/libs/scm-web.jar pwausr:pwausr@10.10.4.121:/home/pwausr/scm-web.jar
    - java -jar /home/pwausr/scm-web.jar &
