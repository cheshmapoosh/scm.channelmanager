plugins {
    id 'ir.daneshrefah.scm.java-library-conventions'
    id 'java'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

compileJava.options.encoding = 'UTF-8'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named("bootJar") {
    mainClass = 'ir.daneshrefah.scm.web.ScmWebApplication'
    archiveClassifier = ''
}
bootJar {
    enabled = true
    version = parent.version
}


compileJava.options.encoding = 'UTF-8'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

dependencies {
//    implementation 'org.springframework.boot:spring-boot-starter'
    implementation project(':scm-gateway')
    implementation project(':scm-uaa-starter')
    implementation project(':scm-observation-starter')
    implementation project(':scm-observation-servlet-starter')
    implementation project(':scm-docs-starter')
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    runtimeOnly 'com.ibm.db2:db2jcc'
    runtimeOnly 'com.ibm.db2:db2jcc_license_cisuz'
    runtimeOnly 'com.ibm.db2.jcc:db2jcc:db2jcc4'
    implementation project(':scm-cache-starter')
    implementation project(':scm-uaa-starter')
    implementation project(':scm-common-log')
    implementation project(':scm-common-data')
    implementation project(':scm-provider-shetab')
    implementation project(':scm-provider-rest')
    implementation project(':scm-provider-scm')
    implementation project(':scm-provider-task')
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    implementation project(':scm-provider-nab')
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    implementation 'org.apache.camel.springboot:camel-spring-security-starter'
    implementation 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testImplementation 'org.apache.camel:camel-test-spring-junit5'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    implementation ('org.codehaus.janino:janino')


}
