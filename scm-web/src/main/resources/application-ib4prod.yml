spring:
  application:
    name: scm-web
  config:
    import: 'optional:configserver:'
    activate:
      on-profile: ib4prod
  cloud:
    config:
      username: scm
      password: scm
      name: scm
      enabled: true
      uri: http://scm-config-server:8088/config


scm:
  otp:
    rest-client:
      base-url: ${SPRING_SECURITY_ISSUER_URI}
      verify-logged-in-url: "/api/otp/verify-by-logged-in-user"