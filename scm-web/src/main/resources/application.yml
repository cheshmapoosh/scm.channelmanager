spring:
  profiles:
    active: ${SCM_ENV:dev}
  application:
    name: ${SCM_APP:scm-web}
  config:
    import: ${SCM_CONFIG_SERVER_IMPORT:optional:configserver:${SCM_CONFIG_SERVER_URL:http://localhost:8888/config}}
  cloud:
    config:
      enabled: ${SCM_CONFIG_ENABLED:false}
      label: ${SCM_LABEL:master}
      username: ${SCM_CONFIG_USERNAME:${SPRING_CLOUD_CONFIG_USERNAME:}}
      password: ${SCM_CONFIG_PASSWORD:${SPRING_CLOUD_CONFIG_PASSWORD:}}
      fail-fast: ${SCM_CONFIG_FAIL_FAST:false}
      retry:
        max-attempts: ${SCM_CONFIG_RETRY_MAX_ATTEMPTS:5}
        max-interval: ${SCM_CONFIG_RETRY_MAX_INTERVAL:3000}
  jpa:
    show-sql: ${SCM_JPA_SHOW_SQL:false}
    open-in-view: ${SCM_JPA_OPEN_IN_VIEW:false}

management:
  endpoints:
    web:
      exposure:
        include: ${SCM_MANAGEMENT_ENDPOINTS_INCLUDE:health,metrics,prometheus}
  endpoint:
    health:
      show-details: ${SCM_MANAGEMENT_HEALTH_SHOW_DETAILS:never}
      probes:
        enabled: ${SCM_MANAGEMENT_HEALTH_PROBES_ENABLED:true}
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,providerReadiness
          show-details: ${SCM_MANAGEMENT_READINESS_SHOW_DETAILS:when_authorized}

server:
  servlet:
    context-path: ${SCM_SERVER_CONTEXT_PATH:/}
  port: ${SCM_SERVER_PORT:${SERVER_PORT:8083}}

camel:
  servlet:
    mapping:
      contextPath: ${SCM_CAMEL_SERVLET_CONTEXT_PATH:/*}

logging:
  config: ${SCM_LOGBACK_CONFIG:classpath:logback-spring.xml}
  level:
    root: ${SCM_LOG_LEVEL_ROOT:INFO}
    ir.daneshrefah: ${SCM_LOG_LEVEL_APPLICATION:INFO}
    org.springframework: ${SCM_LOG_LEVEL_SPRING:INFO}
    org.hibernate.SQL: ${SCM_LOG_LEVEL_HIBERNATE_SQL:WARN}
    org.hibernate.type.descriptor.sql: ${SCM_LOG_LEVEL_HIBERNATE_SQL_TYPE:WARN}
    org.hibernate.orm.jdbc.bind: ${SCM_LOG_LEVEL_HIBERNATE_BIND:WARN}

scm:
  app-name: ${SCM_GATEWAY_NAME}
  channels: ${SCM_CHANNELS:${SCM_CHANNEL_CODE}}
  plugins:
    destination-card-bin-block:
      enabled: ${SCM_PLUGINS_DESTINATION_CARD_BIN_BLOCK_ENABLED:true}
      blocked-bank-bins:
        - "502229"
        - "504172"
        - "505416"
      error:
        code: ${SCM_PLUGINS_DESTINATION_CARD_BIN_BLOCK_ERROR:DESTINATION_CARD_BANK_NOT_ALLOWED}
    destination-iban-bank-block:
      enabled: ${SCM_PLUGINS_DESTINATION_IBAN_BANK_BLOCK_ENABLED:true}
      blocked-bank-codes: []
      error:
        code: ${SCM_PLUGINS_DESTINATION_IBAN_BANK_BLOCK_ERROR:DESTINATION_IBAN_BANK_NOT_ALLOWED}

  metadata:
    namespace: ${SCM_METADATA_NAMESPACE:}
    instance-id: ${SCM_METADATA_INSTANCE_ID:}
    time-zone: ${SCM_METADATA_TIME_ZONE:}

  deployment:
    service-version: ${SCM_SERVICE_VERSION:${VERSION:9.1.0}}

  application:
    version: ${SCM_APPLICATION_VERSION:${VERSION:9.1.0}}
    build: ${SCM_APPLICATION_BUILD:0803T1050}

  provider:
    task:
      enabled: ${SCM_PROVIDER_TASK_ENABLED:true}
      providers:
        internal:
          enabled: ${SCM_TASK_PROVIDER_INTERNAL_ENABLED:true}
          engine-type: ${SCM_TASK_PROVIDER_INTERNAL_ENGINE_TYPE:internal}

  runtime:
    gateway-name: ${SCM_GATEWAY_NAME}
    target:
      kind: ${SCM_RUNTIME_TARGET_KIND:CHANNEL}
      gateway-names: ${SCM_GATEWAY_NAMES:${SCM_GATEWAY_NAME}}
    channel-affinity:
      enabled: ${SCM_RUNTIME_CHANNEL_AFFINITY_ENABLED:false}
      allowed-channel-codes: ${SCM_RUNTIME_ALLOWED_CHANNEL_CODES:*}

  observation:
    http:
      server:
        enabled: false
        mode: channel-only
    log:
      level:
        root: ${SCM_LOG_LEVEL_ROOT:INFO}
        application: ${SCM_LOG_LEVEL_APPLICATION:INFO}
        spring: ${SCM_LOG_LEVEL_SPRING:INFO}
        hibernate: ${SCM_LOG_LEVEL_HIBERNATE:WARN}
        hazelcast: ${SCM_LOG_LEVEL_HAZELCAST:INFO}

  web:
    observation:
      gateway:
        channel:
          path-prefix-mappings: ${SCM_WEB_OBS_GATEWAY_CHANNEL_PATH_PREFIX_MAPPINGS:}
          trusted-header:
            enabled: ${SCM_WEB_OBS_GATEWAY_CHANNEL_TRUSTED_HEADER_ENABLED:false}
            name: ${SCM_WEB_OBS_GATEWAY_CHANNEL_TRUSTED_HEADER_NAME:X-SCM-Channel}
        legacy:
          enabled: ${SCM_WEB_OBS_LEGACY_GATEWAY_ENABLED:false}
          route-mappings: ${SCM_WEB_OBS_LEGACY_GATEWAY_ROUTE_MAPPINGS:}

  datasource:
    primary:
      url: ${SCM_DB_URL}
      username: ${SCM_DB_USERNAME}
      password: ${SCM_DB_PASSWORD}
      driver-class-name: ${SCM_DB_DRIVER:com.ibm.db2.jcc.DB2Driver}
      max-connection: ${SCM_DB_MAX_CONNECTION:10}
      default-schema: ${SCM_DB_SCHEMA:REF}

  security:
    cache:
      session:
        enabled: ${SCM_SECURITY_SESSION_CACHE_ENABLED:true}
        cache-name: ${SCM_SECURITY_SESSION_CACHE_NAME:session_cache}
      user:
        enabled: ${SCM_SECURITY_USER_CACHE_ENABLED:true}
        cache-name: ${SCM_SECURITY_USER_CACHE_NAME:user_cache}
    legacy-authentication:
      enabled: ${SCM_SECURITY_LEGACY_AUTH_ENABLED:true}
      claim:
        enabled: ${SCM_SECURITY_LEGACY_CLAIM_AUTH_ENABLED:false}
    resource-server:
      enabled: ${SCM_RESOURCE_SERVER_ENABLED:true}
      issuer-uri: ${SCM_UAA_BASE_URL}
      jwk-set-uri: ${SCM_UAA_BASE_URL}/oauth2/jwks
      public-paths:
        - /actuator/health/liveness
        - /actuator/health/readiness
        - /v3/api-docs/**
        - /swagger-ui/**
      method-security-enabled: ${SCM_RESOURCE_SERVER_METHOD_SECURITY_ENABLED:true}
      observation:
        enabled: ${SCM_RESOURCE_SERVER_OBSERVATION_ENABLED:true}
        log-enabled: ${SCM_RESOURCE_SERVER_OBS_LOG_ENABLED:true}
        trace-enabled: ${SCM_RESOURCE_SERVER_OBS_TRACE_ENABLED:true}
        metric-enabled: ${SCM_RESOURCE_SERVER_OBS_METRIC_ENABLED:true}
    client-id: ${SCM_SECURITY_CLIENT_ID:scm}
    client-secret: ${SCM_SECURITY_CLIENT_SECRET:}
    distributed: ${SCM_SECURITY_DISTRIBUTED:true}
    person-service: ${SCM_SECURITY_PERSON_SERVICE:local}
    issuer-uri: ${SCM_UAA_BASE_URL}

  otp:
    rest-client:
      enabled: ${SCM_OTP_REST_CLIENT_ENABLED:true}
      auth-header-name: ${SCM_OTP_AUTH_HEADER_NAME:authorization}
      auth-prefix: ${SCM_OTP_AUTH_PREFIX:Bearer }
      base-url: ${SCM_UAA_BASE_URL}
      verify-logged-in-url: ${SCM_OTP_VERIFY_LOGGED_IN_URL:/api/otp/verify-by-logged-in-user}

  gateway:
    idempotency:
      enabled: ${SCM_GATEWAY_IDEMPOTENCY_ENABLED:true}
      map-name: ${SCM_GATEWAY_IDEMPOTENCY_MAP_NAME:restGatewayIdempotentRepository}
      api-paths: ${SCM_GATEWAY_IDEMPOTENCY_API_PATHS:card/cardPasswordInquiry}
    client-contracts:
      defaults:
        REST:
          default:
            name: ${SCM_GATEWAY_REST_DEFAULT_CONTRACT_NAME:rest-default}
            request-decoder: ${SCM_GATEWAY_REST_DEFAULT_REQUEST_DECODER:jsonScmRequestDecoder}
            response-encoder: ${SCM_GATEWAY_REST_DEFAULT_RESPONSE_ENCODER:jsonScmResponseEncoder}
            fault-encoder: ${SCM_GATEWAY_REST_DEFAULT_FAULT_ENCODER:restProblemDetailFaultEncoder}
          versions:
            v1:
              name: ${SCM_GATEWAY_REST_V1_CONTRACT_NAME:rest-legacy-v1}
              request-decoder: ${SCM_GATEWAY_REST_V1_REQUEST_DECODER:legacyMbRequestDecoder}
              response-encoder: ${SCM_GATEWAY_REST_V1_RESPONSE_ENCODER:legacyMbResponseEncoder}
              fault-encoder: ${SCM_GATEWAY_REST_V1_FAULT_ENCODER:legacyMbFaultEncoder}
            v2:
              name: ${SCM_GATEWAY_REST_V2_CONTRACT_NAME:rest-legacy-v2}
              request-decoder: ${SCM_GATEWAY_REST_V2_REQUEST_DECODER:jsonScmRequestDecoder}
              response-encoder: ${SCM_GATEWAY_REST_V2_RESPONSE_ENCODER:jsonScmResponseEncoder}
              fault-encoder: ${SCM_GATEWAY_REST_V2_FAULT_ENCODER:restProblemDetailFaultEncoder}

  providers:
    hps-rest:
      scheme: ${SCM_HPS_REST_SCHEME:scm-rest}
      enabled: ${SCM_HPS_REST_ENABLED:true}
      base-url: ${SCM_HPS_REST_BASE_URL:${SCM_HPS_BASE_URL}/general/ws/do}
      connect-timeout-ms: ${SCM_HPS_REST_CONNECT_TIMEOUT_MS:${SCM_PROVIDER_DEFAULT_CONNECT_TIMEOUT_MS:3000}}
      response-timeout-ms: ${SCM_HPS_REST_RESPONSE_TIMEOUT_MS:${SCM_PROVIDER_DEFAULT_RESPONSE_TIMEOUT_MS:8000}}
      virtual-threads-enabled: ${SCM_HPS_REST_VIRTUAL_THREADS_ENABLED:true}
      insecure-ssl: ${SCM_HPS_REST_INSECURE_SSL:false}
      follow-redirects: ${SCM_HPS_REST_FOLLOW_REDIRECTS:NORMAL}
      default-method: ${SCM_HPS_REST_DEFAULT_METHOD:POST}
      headers:
        Accept: ${SCM_HPS_REST_ACCEPT_HEADER:application/json}
        Content-Type: ${SCM_HPS_REST_CONTENT_TYPE_HEADER:application/json}
      security:
        sensitive-headers: ${SCM_HPS_REST_SENSITIVE_HEADERS:authorization,proxy-authorization,cookie,set-cookie}
        sensitive-body-keys: ${SCM_HPS_REST_SENSITIVE_BODY_KEYS:password,token,secret,pin,cvv,pan,card}
        max-body-log-length: ${SCM_HPS_REST_MAX_BODY_LOG_LENGTH:400}
      rate-limit:
        enabled: ${SCM_HPS_REST_RATE_LIMIT_ENABLED:false}
        bucket: ${SCM_HPS_REST_RATE_LIMIT_BUCKET:hps-rest}
        key: ${SCM_HPS_REST_RATE_LIMIT_KEY:provider-operation}
      message-customizers:
        - type: ${SCM_HPS_REST_AUTH_CUSTOMIZER_TYPE:rest-static-auth}
          config:
            type: ${SCM_HPS_REST_AUTH_TYPE:BASIC}
            header-name: ${SCM_HPS_REST_AUTH_HEADER_NAME:Authorization}
            username: ${SCM_HPS_REST_USERNAME}
            password: ${SCM_HPS_REST_PASSWORD}
            basic-base64: ${SCM_HPS_REST_BASIC_BASE64:true}
        - type: ${SCM_HPS_REST_PIN_BLOCK_CUSTOMIZER_TYPE:rest-shetab-pin-block}
          config:
            key: ${SCM_HPS_SHETAB7_PIN_KEY}
            pin-source: ${SCM_HPS_REST_PIN_SOURCE:data.pin}
            pan-source: ${SCM_HPS_REST_PAN_SOURCE:data.cardNumber}

    hps-shetab7:
      scheme: ${SCM_HPS_SHETAB7_SCHEME:scm-shetab}
      enabled: ${SCM_HPS_SHETAB7_ENABLED:false}
      endpoints: ${SCM_HPS_SHETAB7_ENDPOINTS}
      packager-class: ${SCM_HPS_SHETAB7_PACKAGER_CLASS:Shetab7AsciiXAPackager}
      connect-timeout-ms: ${SCM_HPS_SHETAB7_CONNECT_TIMEOUT_MS:${SCM_PROVIDER_DEFAULT_CONNECT_TIMEOUT_MS:3000}}
      socket-timeout-ms: ${SCM_HPS_SHETAB7_SOCKET_TIMEOUT_MS:0}
      response-timeout-ms: ${SCM_HPS_SHETAB7_RESPONSE_TIMEOUT_MS:${SCM_PROVIDER_DEFAULT_RESPONSE_TIMEOUT_MS:8000}}
      send-timeout-ms: ${SCM_HPS_SHETAB7_SEND_TIMEOUT_MS:${SCM_PROVIDER_DEFAULT_SEND_TIMEOUT_MS:1000}}
      reconnect-delay-ms: ${SCM_HPS_SHETAB7_RECONNECT_DELAY_MS:1000}
      same-endpoint-reconnect-attempts: ${SCM_HPS_SHETAB7_SAME_ENDPOINT_RECONNECT_ATTEMPTS:3}
      queue-capacity: ${SCM_HPS_SHETAB7_QUEUE_CAPACITY:${SCM_PROVIDER_DEFAULT_QUEUE_CAPACITY:1000}}
      endpoint-lease:
        enabled: ${SCM_HPS_SHETAB7_ENDPOINT_LEASE_ENABLED:true}
        ttl-ms: ${SCM_HPS_SHETAB7_ENDPOINT_LEASE_TTL_MS:30000}
      rate-limit:
        enabled: ${SCM_HPS_SHETAB7_RATE_LIMIT_ENABLED:false}
        bucket: ${SCM_HPS_SHETAB7_RATE_LIMIT_BUCKET:hps-shetab7}
        key: ${SCM_HPS_SHETAB7_RATE_LIMIT_KEY:provider-operation}
      message-customizers:
        - type: ${SCM_HPS_SHETAB7_EXPIRY_CUSTOMIZER_TYPE:shetab-expiry}
          config:
            field: ${SCM_HPS_SHETAB7_EXPIRY_FIELD:14}
            source: ${SCM_HPS_SHETAB7_EXPIRY_SOURCE:security.expiryDate}
        - type: ${SCM_HPS_SHETAB7_CVV2_CUSTOMIZER_TYPE:shetab-cvv2}
          config:
            field: ${SCM_HPS_SHETAB7_CVV2_FIELD:48}
            tag: ${SCM_HPS_SHETAB7_CVV2_TAG:P92}
            source: ${SCM_HPS_SHETAB7_CVV2_SOURCE:security.cvv2}
            length-digits: ${SCM_HPS_SHETAB7_CVV2_LENGTH_DIGITS:3}
            min-length: ${SCM_HPS_SHETAB7_CVV2_MIN_LENGTH:3}
            max-length: ${SCM_HPS_SHETAB7_CVV2_MAX_LENGTH:4}
        - type: ${SCM_HPS_SHETAB7_PIN_BLOCK_CUSTOMIZER_TYPE:shetab-pin-block}
          config:
            key: ${SCM_HPS_SHETAB7_PIN_KEY}
            field: ${SCM_HPS_SHETAB7_PIN_FIELD:52}
            pan-field: ${SCM_HPS_SHETAB7_PAN_FIELD:2}
            pin-source: ${SCM_HPS_SHETAB7_PIN_SOURCE:security.pin}
        - type: ${SCM_HPS_SHETAB7_MAC_CUSTOMIZER_TYPE:shetab-mac}
          config:
            key: ${SCM_HPS_SHETAB7_MAC_KEY}
            field: ${SCM_HPS_SHETAB7_MAC_FIELD:128}
            verify-response: ${SCM_HPS_SHETAB7_MAC_VERIFY_RESPONSE:false}

    api-repo:
      scheme: ${SCM_API_REPO_SCHEME:${SCM_API_REPO_SCHEMA:scm-rest}}
      enabled: ${SCM_API_REPO_ENABLED:true}
      base-url: ${SCM_API_REPO_BASE_URL:${SCM_HPS_BASE_URL}}
      connect-timeout-ms: ${SCM_API_REPO_CONNECT_TIMEOUT_MS:${SCM_PROVIDER_DEFAULT_CONNECT_TIMEOUT_MS:3000}}
      response-timeout-ms: ${SCM_API_REPO_RESPONSE_TIMEOUT_MS:${SCM_PROVIDER_DEFAULT_RESPONSE_TIMEOUT_MS:8000}}
      virtual-threads-enabled: ${SCM_API_REPO_VIRTUAL_THREADS_ENABLED:true}
      insecure-ssl: ${SCM_API_REPO_INSECURE_SSL:false}
      follow-redirects: ${SCM_API_REPO_FOLLOW_REDIRECTS:NORMAL}
      default-method: ${SCM_API_REPO_DEFAULT_METHOD:POST}
      headers:
        Accept: ${SCM_API_REPO_ACCEPT_HEADER:application/json}
        Content-Type: ${SCM_API_REPO_CONTENT_TYPE_HEADER:application/json}

    nab-atps:
      scheme: ${SCM_NAB_ATPS_SCHEME:scm-nab}
      enabled: ${SCM_NAB_ATPS_ENABLED:true}
      protocol: ${SCM_NAB_ATPS_PROTOCOL:ATPS}
      endpoint: ${SCM_NAB_ATPS_ENDPOINT}
      connect-timeout-ms: ${SCM_NAB_ATPS_CONNECT_TIMEOUT_MS:${SCM_PROVIDER_DEFAULT_CONNECT_TIMEOUT_MS:3000}}
      socket-timeout-ms: ${SCM_NAB_ATPS_SOCKET_TIMEOUT_MS:${SCM_PROVIDER_DEFAULT_SOCKET_TIMEOUT_MS:1000}}
      response-timeout-ms: ${SCM_NAB_ATPS_RESPONSE_TIMEOUT_MS:${SCM_PROVIDER_DEFAULT_RESPONSE_TIMEOUT_MS:6000}}
      ack-length-bytes: ${SCM_NAB_ATPS_ACK_LENGTH_BYTES:5}
      charset: ${SCM_NAB_ATPS_CHARSET:windows-1256}
      user-id: ${SCM_NAB_ATPS_USER_ID}
      password: ${SCM_NAB_ATPS_PASSWORD}
      rq-uid:
        length: ${SCM_NAB_ATPS_RQ_UID_LENGTH:16}
        type: ${SCM_NAB_ATPS_RQ_UID_TYPE:NUMERIC}
      header-fields:
        - name: ${SCM_NAB_ATPS_HEADER_PROTOCOL_NAME:protocol}
          length: ${SCM_NAB_ATPS_HEADER_PROTOCOL_LENGTH:4}
          required: ${SCM_NAB_ATPS_HEADER_PROTOCOL_REQUIRED:true}
        - name: ${SCM_NAB_ATPS_HEADER_COMMAND_NAME:command}
          length: ${SCM_NAB_ATPS_HEADER_COMMAND_LENGTH:2}
          required: ${SCM_NAB_ATPS_HEADER_COMMAND_REQUIRED:true}
        - name: ${SCM_NAB_ATPS_HEADER_SERVICE_CODE_NAME:serviceCode}
          length: ${SCM_NAB_ATPS_HEADER_SERVICE_CODE_LENGTH:2}
          required: ${SCM_NAB_ATPS_HEADER_SERVICE_CODE_REQUIRED:true}
        - name: ${SCM_NAB_ATPS_HEADER_DATE_TIME_NAME:dateTime}
          length: ${SCM_NAB_ATPS_HEADER_DATE_TIME_LENGTH:14}
          required: ${SCM_NAB_ATPS_HEADER_DATE_TIME_REQUIRED:true}
        - name: ${SCM_NAB_ATPS_HEADER_USER_ID_NAME:userId}
          length: ${SCM_NAB_ATPS_HEADER_USER_ID_LENGTH:10}
          required: ${SCM_NAB_ATPS_HEADER_USER_ID_REQUIRED:true}
        - name: ${SCM_NAB_ATPS_HEADER_PASSWORD_NAME:password}
          length: ${SCM_NAB_ATPS_HEADER_PASSWORD_LENGTH:10}
          required: ${SCM_NAB_ATPS_HEADER_PASSWORD_REQUIRED:true}
        - name: ${SCM_NAB_ATPS_HEADER_RQ_UID_NAME:rqUid}
          length: ${SCM_NAB_ATPS_HEADER_RQ_UID_LENGTH:16}
          required: ${SCM_NAB_ATPS_HEADER_RQ_UID_REQUIRED:true}
      rate-limit:
        enabled: ${SCM_NAB_ATPS_RATE_LIMIT_ENABLED:false}
        bucket: ${SCM_NAB_ATPS_RATE_LIMIT_BUCKET:nab-atps}
        key: ${SCM_NAB_ATPS_RATE_LIMIT_KEY:provider-operation}

  cache:
    client:
      distributed: ${SCM_CACHE_CLIENT_DISTRIBUTED:true}
      default-type: ${SCM_CACHE_CLIENT_DEFAULT_TYPE:remote}
      remote:
        cluster-name: ${SCM_CACHE_REMOTE_CLUSTER_NAME:scm-cache}
        addresses: ${SCM_CACHE_REMOTE_ADDRESSES:127.0.0.1:5701}
      local:
        ttl: ${SCM_CACHE_LOCAL_TTL:0s}
        maximum-size: ${SCM_CACHE_LOCAL_MAXIMUM_SIZE:10000}
      near:
        enabled: ${SCM_CACHE_NEAR_ENABLED:true}
        maximum-size: ${SCM_CACHE_NEAR_MAXIMUM_SIZE:10000}
        invalidate-on-change: ${SCM_CACHE_NEAR_INVALIDATE_ON_CHANGE:true}
        in-memory-format: ${SCM_CACHE_NEAR_IN_MEMORY_FORMAT:OBJECT}
      caches:
        ebServiceByCode:
          type: local
        session_cache:
          type: ${SCM_CACHE_SESSION_TYPE:near}
          remote-name: ${SCM_CACHE_SESSION_REMOTE_NAME:session_cache}
          maximum-size: ${SCM_CACHE_SESSION_NEAR_MAXIMUM_SIZE:10000}
        user_cache:
          type: ${SCM_CACHE_USER_TYPE:near}
          remote-name: ${SCM_CACHE_USER_REMOTE_NAME:user_cache}
          maximum-size: ${SCM_CACHE_USER_NEAR_MAXIMUM_SIZE:10000}
        scm-web-api-doc-catalog:
          type: local
          ttl: ${SCM_CACHE_API_DOC_CATALOG_TTL:60s}
          maximum-size: ${SCM_CACHE_API_DOC_CATALOG_MAXIMUM_SIZE:128}
        bank:
          type: local
        userCards:
          type: ${SCM_CACHE_USER_CARDS_TYPE:remote}
          remote-name: ${SCM_CACHE_USER_CARDS_REMOTE_NAME:userCards}

  membership-access:
    default-services: ${SCM_MEMBERSHIP_DEFAULT_SERVICES:TAccListInq,AcctInq}

  asset-provider:
    configs:
      NAB:
        provider-service-code: ${SCM_ASSET_PROVIDER_NAB_SERVICE_CODE:SVC_NAB_ACCOUNT_LIST_PROXY}

  jms:
    logout:
      enabled: ${SCM_LOGOUT_JMS_ENABLED:true}
      host: ${SCM_LOGOUT_JMS_HOST:}
      port: ${SCM_LOGOUT_JMS_PORT:1818}
      channel: ${SCM_LOGOUT_JMS_CHANNEL:SYSTEM.ADMIN.SVRCONN}
      queueManager: ${SCM_LOGOUT_JMS_QUEUE_MANAGER:}
      username: ${SCM_LOGOUT_JMS_USERNAME:}
      password: ${SCM_LOGOUT_JMS_PASSWORD:}
      topic: ${SCM_LOGOUT_JMS_TOPIC:SUA/LOGOUT}

  transformers:
    dir: ${SCM_TRANSFORMERS_DIR:/transformers}
