spring:
  profiles:
    active: default
  application:
    name: ${SCM_APPLICATION_NAME}
management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
scm:
  provider:
    task:
      jpa:
        enabled: true
  cache:
    client:
      caches:
        scm-web-api-doc-catalog:
          type: local
          ttl: 60s
          maximum-size: 128
  application:
    version: 9.0.0
    build:  0521T1030
