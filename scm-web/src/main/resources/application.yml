scm:
  profile: IB4DEV
  channels: SCM4DEV, IB
  datasource:
    primary:
      url: jdbc:db2://10.10.4.104:50001/DBREFSW
      username: db2inst1
      password: db2inst1
      driver-class-name: com.ibm.db2.jcc.DB2Driver
      max-connection: 10
      default-schema: REF
    secondary:
      -
        name: default
        url: jdbc:db2://10.10.4.104:50001/DBREFSW
        username: db2inst1
        password: db2inst1
        driver-class-name: com.ibm.db2.jcc.DB2Driver
        max-connection: 10
        default-schema: REF
      -
        name: default2
        url: jdbc:db2://10.10.4.104:50001/DBREFSW
        username: db2inst1
        password: db2inst1
        driver-class-name: com.ibm.db2.jcc.DB2Driver
        max-connection: 10
        default-schema: REF
  log:
    enabled: true
    type: file
  security:
    client-id: scm
    client-secret:
    distributed: true
    issuer-uri: http://localhost:8000
  cache:
    client:
      config:
        distributed: false
        cluster-name: dev3
        server-host: 127.0.0.1
        server-port: 5701
        near-cache-config:
          myMap:
            in-memory-format: object
            time-to-live-seconds: 10


server:
  servlet:
    context-path: /scm
  port: 8086
