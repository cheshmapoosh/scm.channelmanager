scm:
  channels: SCM4DEV
  provider:
    nab: http://scm-core.daneshrefah.ir/Service
    iban: http://10.15.29.131:8086/ibanq/services/IBANService
    #    iban: http://10.15.8.195:8080/ibanq/services/IBANService
    pichack: http://10.15.27.51:8080/dpi/api/pichak
    #    pichack: http://10.15.46.105:8080/dpi/api/pichak
    sayad: http://10.15.1.98:8080/sayad/services/api
  #    sayad: http://10.15.46.20:8080/sayad/services/api
  datasource:
    primary:
      url: jdbc:mysql://localhost:3306/ref
      username: root
      password: 12345
      driver-class-name: com.mysql.cj.jdbc.Driver
      max-connection: 10
      default-schema: REF
    secondary:
      -
        name: default
        url: jdbc:mysql://localhost:3306/ref
        username: root
        password: 12345
        driver-class-name: com.mysql.cj.jdbc.Driver
        max-connection: 10
        default-schema: REF
      -
        name: default2
        url: jdbc:mysql://localhost:3306/ref
        username: root
        password: 12345
        driver-class-name: com.mysql.cj.jdbc.Driver
        max-connection: 10
        default-schema: REF
  log:
    enabled: true
    type: file
  security:
    client-id: scm
    client-secret:
    distributed: true
    person-service: local
    issuer-uri: http://localhost:8000
  cache:
    client:
      config:
        distributed: false
        cluster-name: dev3
        server-host: 127.0.0.1
        server-port: 5701
        near-cache-config:
          myMap:
            in-memory-format: object
            time-to-live-seconds: 10
  process:
    enabled: true
    jdbc-url: jdbc:mysql://localhost:3306/ref
    jdbc-driver-class-name: com.mysql.cj.jdbc.Driver
    jdbc-username: root
    jdbc-password: 12345
  swagger:
    server-host: localhost

server:
  servlet:
    context-path: /scm
  port: 8086
