SCM_APPLICATION_NAME: scm-web
scm:
  app-name: domain.card
  channels: MB4TEST
  runtime:
    target:
      kind: SERVICE_DOMAIN
      gateway-names:
        - domain.card
  gateway:
    client-contracts:
      defaults:
        REST:
          default:
            name: rest-default
            request-decoder: jsonScmRequestDecoder
            response-encoder: jsonScmResponseEncoder
            fault-encoder: restProblemDetailFaultEncoder
          versions:
            v1:
              name: rest-legacy-v1
              request-decoder: legacyMbRequestDecoder
              response-encoder: legacyMbResponseEncoder
              fault-encoder: legacyMbFaultEncoder
            v2:
              name: rest-legacy-v2
              request-decoder: jsonScmRequestDecoder
              response-encoder: jsonScmResponseEncoder
              fault-encoder: restProblemDetailFaultEncoder
  logging:
    datasource:
      enabled: true
      url: jdbc:db2://10.15.27.82:546/DSNBLOC
      username: casadm
      password: a
      driver-class-name: com.ibm.db2.jcc.DB2Driver
      max-connection: 10
      default-schema: REF
  providers:
    # Operation provider URIs use <scheme>:<provider-code>, for example:
    # scm-rest:hps-rest and scm-shetab:hps-shetab7.
    hps-rest:
      scheme: scm-rest
      enabled: true
      base-url: http://10.15.1.61:9677/general/ws/do
      connect-timeout-ms: 3000
      response-timeout-ms: 8000
      virtual-threads-enabled: true
      insecure-ssl: false
      follow-redirects: NORMAL
      default-method: POST
      headers:
        Accept: application/json
        Content-Type: application/json
      security:
        sensitive-headers:
          - authorization
          - proxy-authorization
          - cookie
          - set-cookie
        sensitive-body-keys:
          - password
          - token
          - secret
          - pin
          - cvv
          - pan
          - card
        max-body-log-length: 400
      rate-limit:
        enabled: false
        bucket: hps-rest
        key: provider-operation
      message-customizers:
        - type: rest-static-auth
          config:
            type: BASIC
            header-name: Authorization
            username: ${HPS_REST_USERNAME:depositUser}
            password: ${HPS_REST_PASSWORD:depositUser}
            basic-base64: true
        - type: rest-shetab-pin-block
          config:
            key: ${SCM_HPS_SHETAB7_PIN_KEY:1C1C1C1C1C1C1C1C}
            pin-source: data.pin
            pan-source: data.cardNumber
    hps-shetab7:
      scheme: scm-shetab
      enabled: true
      endpoints:
        - 10.15.1.61:32001
      packager-class: Shetab7AsciiXAPackager
      connect-timeout-ms: 3000
      socket-timeout-ms: 1000
      response-timeout-ms: 10000
      send-timeout-ms: 1000
      reconnect-delay-ms: 1000
      same-endpoint-reconnect-attempts: 3
      queue-capacity: 1000
      endpoint-lease:
        enabled: true
        ttl-ms: 30000
      rate-limit:
        enabled: false
        bucket: hps-shetab7
        key: provider-operation
      message-customizers:
        - type: shetab-expiry
          config:
            field: 14
            source: security.expiryDate

        - type: shetab-cvv2
          config:
            field: 48
            tag: P92
            source: security.cvv2
            length-digits: 3
            min-length: 3
            max-length: 4

        - type: shetab-pin-block
          config:
            key: ${SCM_HPS_SHETAB7_PIN_KEY:1C1C1C1C1C1C1C1C}
            field: 52
            pan-field: 2
            pin-source: security.pin

        - type: shetab-mac
          config:
            key: ${SCM_HPS_SHETAB7_MAC_KEY:1C1C1C1C1C1C1C1C}
            field: 128
            verify-response: false
    api-repo:
      schema: nab-api-repo
      enabled: true
      base-url: http://10.15.1.61:9677
      connect-timeout-ms: 3000
      response-timeout-ms: 8000
      virtual-threads-enabled: true
      insecure-ssl: false
      follow-redirects: NORMAL
      default-method: POST
      headers:
        Accept: application/json
        Content-Type: application/json

  #    sayad: http://10.15.46.20:8080/sayad/services/api
  datasource:
    primary:
      url: jdbc:db2://10.15.27.82:446/DSNALOC
      username: casadm
      password: a
      driver-class-name: com.ibm.db2.jcc.DB2Driver
      max-connection: 10
      default-schema: REF
    secondary:
      -
        name: default
        url: jdbc:db2://10.15.27.82:446/DSNALOC
        username: casadm
        password: a
        driver-class-name: com.ibm.db2.jcc.DB2Driver
        max-connection: 10
        default-schema: REF
      - name: default2
        url: jdbc:db2://10.15.27.82:446/DSNALOC
        username: casadm
        password: a
        driver-class-name: com.ibm.db2.jcc.DB2Driver
        max-connection: 10
        default-schema: REF
  log:
    trace:
      file-directory: log/trace
      rolling-archive-directory: archive
      file-name: ${spring.application.name}.log
      log-pattern: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %msg%n"
      file-name-pattern: "%d{yyyy-MM-dd}.%i.log"
      file-size: 1MB  #Max size of each log file
      keep-log-history: 30 #Keep up to 30 days of log files
    app:
      console-enabled: true
      file-directory: log/app
      rolling-archive-directory: archive
      log-pattern: '%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] [%X{traceId:-}] %logger{36} - %msg%n'
      file-name-pattern: "%d{yyyy-MM-dd}.%i.log"
      file-size: 1MB  #Max size of each log file
      keep-log-history: 30 #Keep up to 30 days of log files
  security:
    client-id: scm
    client-secret:
    distributed: true
    person-service: local
    issuer-uri: http://10.10.4.126:8000
  cache:
    client:
      distributed: true
      caches:
        bank:
          type: local
      config:
        clusterName: scm
        network-config:
          addresses:
            - '10.10.4.122:5701'
        nearCacheConfigMap:
          myMap:
            in-memory-format: object
            time-to-live-seconds: 10
  otp:
    rest-client:
      enabled: true
      auth-header-name: "authorization"
      auth-prefix: "Bearer "
      base-url: "http://10.10.4.126:8000"
      verify-logged-in-url: "/api/otp/verify-by-logged-in-user"
  membership-access:
    default-services:
      - TAccListInq
      - AcctInq
  asset-provider:
    configs:
      NAB:
        provider-service-code: SVC_NAB_ACCOUNT_LIST_PROXY
  jms:
    logout:
      enabled: true
      host: 10.15.1.185
      port: 1818
      channel: SYSTEM.ADMIN.SVRCONN
      queueManager: CSQ2
      username:
      password:
      topic: SUA/LOGOUT
  transformers:
    dir: /transformers
server:
  servlet:
    context-path: /
  port: 8083
camel:
  servlet:
    mapping:
      contextPath: /*
