SCM_APPLICATION_NAME: domain.card
scm:
  app-name: domain.card
  channels: MB4TEST
  runtime:
    gateway-name: domain.card
  logging:
    datasource:
      enabled: true
      url: jdbc:db2://10.15.27.82:546/DSNBLOC
      username: casadm
      password: a
      driver-class-name: com.ibm.db2.jcc.DB2Driver
      max-connection: 10
      default-schema: REF
  provider:
    nab: http://scm-core.daneshrefah.ir/Service
    nab-tcp: 10.15.27.12:3080
    iban: http://10.15.29.131:8086/ibanq/services/IBANService
    #    iban: http://10.15.8.195:8080/ibanq/services/IBANService
    pichack: http://10.15.27.51:8080/dpi/api/pichak
    #    pichack: http://10.15.46.105:8080/dpi/api/pichak
    sayad: http://10.15.1.98:8080/sayad/services/api
    shetab:
      enabled: true
      defaults:
        connect-timeout-ms: 3000
        socket-timeout-ms: 1000
        response-timeout-ms: 10000
        send-timeout-ms: 1000
        reconnect-delay-ms: 1000
        same-endpoint-reconnect-attempts: 3
        queue-capacity: 1000
        rate-limit:
          enabled: false
          bucket: unused
          key: provider
        endpoint-lease:
          enabled: true
          ttl-ms: 30000
      providers:
        hps:
          endpoints: [ 10.15.1.61:32001 ]
          packager-class: Shetab7AsciiXAPackager
          security:
            pin:
              key: 1C1C1C1C1C1C1C1C
              field: 52
              pan-field: 2
            expiry:
              field: 14
            cvv2:
              field: 48
              tag: P92
              length-digits: 3
              min-length: 3
              max-length: 4
            mac:
              key: 1C1C1C1C1C1C1C1C
              field: 128
              verify-response: false
          rate-limit:
            enabled: false
            bucket: unused
    rest-provider:
      enabled: true
      defaults:
        base-url: http://10.15.1.61:9677/general/ws/do
        connect-timeout-ms: 3000
        response-timeout-ms: 8000
        virtual-threads-enabled: true
        insecure-ssl: false
        follow-redirects: NORMAL # NEVER | NORMAL | ALWAYS
        default-method: POST
        headers:
          Accept: application/json
          Content-Type: application/json
        auth:
          type: BASIC # NONE | BASIC | BEARER | JWT | API_KEY
          header-name: Authorization
          prefix: ""
          token: ""
          username: "user01"
          password: "pass01"
          basic-base64: true
        token:
          enabled: false
          cache-name: rest_provider_token_cache
          cache-key: access-token
          lock-name: rest-provider-token
          early-refresh-seconds: 30
          default-expires-in-seconds: 300
          method: POST
          path: /connect/token
          headers:
            Content-Type: application/x-www-form-urlencoded
          form:
            grant_type: client_credentials
            client_id: cm_develop
            client_secret: ${HPS_CLIENT_SECRET}
          auth:
            type: BASIC
          response-token-field: access_token
          response-expires-in-field: expires_in
          response-token-type-field: token_type
          default-token-type: Bearer
        security:
          sensitive-headers: [ authorization, proxy-authorization, cookie, set-cookie ]
          sensitive-body-keys: [ password, token, secret, pin, cvv, pan, card ]
          max-body-log-length: 400
      providers:
        hpsRest:
          base-url: http://10.15.1.61:9677/general/ws/do
          default-method: POST
          auth:
            type: BASIC
          token:
            enabled: false
            path: /oauth/token
            form:
              grant_type: client_credentials
              client_id: ${HPS_CLIENT_ID}
              client_secret: ${HPS_CLIENT_SECRET}
  #    sayad: http://10.15.46.20:8080/sayad/services/api
  datasource:
    primary:
      url: jdbc:db2://10.15.27.82:446/DSNALOC
      username: casadm
      password: a
      driver-class-name: com.ibm.db2.jcc.DB2Driver
      max-connection: 10
      default-schema: REF
    secondary:
      -
        name: default
        url: jdbc:db2://10.15.27.82:446/DSNALOC
        username: casadm
        password: a
        driver-class-name: com.ibm.db2.jcc.DB2Driver
        max-connection: 10
        default-schema: REF
      - name: default2
        url: jdbc:db2://10.15.27.82:446/DSNALOC
        username: casadm
        password: a
        driver-class-name: com.ibm.db2.jcc.DB2Driver
        max-connection: 10
        default-schema: REF
  log:
    trace:
      file-directory: log/trace
      rolling-archive-directory: archive
      file-name: ${spring.application.name}.log
      log-pattern: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level %msg%n"
      file-name-pattern: "%d{yyyy-MM-dd}.%i.log"
      file-size: 1MB  #Max size of each log file
      keep-log-history: 30 #Keep up to 30 days of log files
    app:
      console-enabled: true
      file-directory: log/app
      rolling-archive-directory: archive
      log-pattern: '%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] [%X{traceId:-}] %logger{36} - %msg%n'
      file-name-pattern: "%d{yyyy-MM-dd}.%i.log"
      file-size: 1MB  #Max size of each log file
      keep-log-history: 30 #Keep up to 30 days of log files
  security:
    client-id: scm
    client-secret:
    distributed: true
    person-service: local
    issuer-uri: http://10.10.4.125:8000
  cache:
    client:
      distributed: true
      caches:
        bank:
          type: local
      config:
        clusterName: dev3
        network-config:
          addresses:
            - '10.10.4.125:5701'
        nearCacheConfigMap:
          myMap:
            in-memory-format: object
            time-to-live-seconds: 10
  otp:
    rest-client:
      enabled: true
      auth-header-name: "authorization"
      auth-prefix: "Bearer "
      base-url: "http://127.0.0.1:8000"
      verify-logged-in-url: "/api/otp/verify-by-logged-in-user"
  membership-access:
    default-services:
      - TAccListInq
      - AcctInq
  asset-provider:
    configs:
      NAB:
        provider-service-code: SVC_NAB_ACCOUNT_LIST_PROXY
  jms:
    logout:
      enabled: true
      host: 10.15.1.185
      port: 1818
      channel: SYSTEM.ADMIN.SVRCONN
      queueManager: CSQ2
      username:
      password:
      topic: SUA/LOGOUT
  transformers:
    dir: /transformers
server:
  servlet:
    context-path: /
  port: 8083
camel:
  servlet:
    mapping:
      contextPath: /*
