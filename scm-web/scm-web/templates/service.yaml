apiVersion: v1
kind: Service
metadata:
  name: {{ include "scm-web.fullname" . }}
  labels:
    {{- include "scm-web.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.swagger.port }}
      targetPort: swagger
      protocol: TCP
      name: swagger
  selector:
    {{- include "scm-web.selectorLabels" . | nindent 4 }}
