# Default values for scm-web.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: dockerhub.daneshrefah.ir/drp/scm-app
  pullPolicy: Always
  # Overrides the image tag whose default is the chart appVersion.
  tag: "0.0.4"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccountName: scm-cache-service-account

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

swagger:
  type: ClusterIP
  port: 8086

service:
  type: ClusterIP
  port: 8082

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: scm-web.daneshrefah.ir
      paths:
        - path: /
          pathType: Prefix
          backend:
            service:
              port:
                number: 8082
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

#livenessProbe:
#  httpGet:
#    path: /public/token
#    port: 8087
#    scheme: HTTP
#  initialDelaySeconds: 30
#  timeoutSeconds: 3
#  periodSeconds: 30
#  successThreshold: 1
#  failureThreshold: 5

#readinessProbe:
#  httpGet:
#    path: /public/token
#    port: 8087
#    scheme: HTTP
#  initialDelaySeconds: 10
#  timeoutSeconds: 3
#  periodSeconds: 30

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes:
  - name: log-hostpath-volume
    hostPath:
      path: /log
      type: DirectoryOrCreate
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts:
  - name: log-hostpath-volume
    mountPath: "/mnt/log"
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

tolerations:
  - key: "app.drp.group/name"
    operator: "Equal"
    value: "scm-web"
    effect: "NoSchedule"

nodeSelector:
  app: scm-web

affinity: {}

environments:
  - name: SPRING_PROFILES_ACTIVE
    value: "ib4dev"
  - name: SCM_APP
    value: "scm-web"
  - name: SERVER_PORT
    value: "8086"