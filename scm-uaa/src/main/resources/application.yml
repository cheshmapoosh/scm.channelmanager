

scm:
  cif:
    url: http://scm-core.daneshrefah.ir/Service/
  security:
    key-store:
      name: config/keystore.p12
      password: password
      alias: selfsigned
    authenticationDatasource:
      url: jdbc:db2://10.10.4.104:50001/DBREFSW
      username: db2inst1
      password: db2inst1
      driver-class-name: com.ibm.db2.jcc.DB2Driver
      max-connection: 10
      default-schema: REF
    activationDatasource:
      url: jdbc:db2://10.10.4.104:50001/DBREFSW
      username: db2inst1
      password: db2inst1
      driver-class-name: com.ibm.db2.jcc.DB2Driver
      max-connection: 10
      default-schema: REF
  cache:
    client:
      config:
        distributed: false
        cluster-name: dev3
        server-host: 10.10.4.125
        server-port: 5701
  notification:
    consumer:
      enabled: false
      strategy: database_queued
      database-queue-config:
        max-sending-status-minute: 5
    producer:
      enabled: false
      mode: distributed
    data-source:
      url: jdbc:db2://10.10.4.104:50001/DBREFSW
      username: db2inst1
      password: db2inst1
      driver-class-name: com.ibm.db2.jcc.DB2Driver
      max-connection: 10
      default-schema: REF
  captcha:
    border:
      enabled: true
      color: '200,200,200'
      thickness: 1
    noise:
      color: '124,133,174'
    items:
      login:
        path: /public/login/captcha
        session:
          key: loginCaptchaKey
          date: loginCaptchaDate
        background:
          color-from: '81,89,130'
          color-to: '81,89,130'
        text-producer:
          font:
            color: '255,255,255'





