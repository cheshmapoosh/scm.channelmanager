spring:
  profiles:
    active: ${SCM_ENV:dev}
  application:
    name: ${SCM_APP:scm-uaa}
  config:
    import: ${SCM_CONFIG_SERVER_IMPORT:optional:configserver:${SCM_CONFIG_SERVER_URL:http://localhost:8888/config}}
  cloud:
    config:
      enabled: ${SCM_CONFIG_ENABLED:false}
      label: ${SCM_LABEL:master}
      username: ${SCM_CONFIG_USERNAME:${SPRING_CLOUD_CONFIG_USERNAME:}}
      password: ${SCM_CONFIG_PASSWORD:${SPRING_CLOUD_CONFIG_PASSWORD:}}
      fail-fast: ${SCM_CONFIG_FAIL_FAST:false}
      retry:
        max-attempts: ${SCM_CONFIG_RETRY_MAX_ATTEMPTS:5}
        max-interval: ${SCM_CONFIG_RETRY_MAX_INTERVAL:3000}
  jpa:
    show-sql: ${SCM_JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${SCM_HIBERNATE_FORMAT_SQL:false}

server:
  port: ${SCM_SERVER_PORT:${SERVER_PORT:8000}}
  ssl:
    enabled: ${SCM_UAA_SSL_ENABLED:false}
    key-store: ${SCM_UAA_SSL_KEY_STORE:}
    key-store-password: ${SCM_UAA_SSL_KEY_STORE_PASSWORD:}
    key-store-type: ${SCM_UAA_SSL_KEY_STORE_TYPE:PKCS12}
    key-alias: ${SCM_UAA_SSL_KEY_ALIAS:}

management:
  endpoints:
    web:
      exposure:
        include: ${SCM_MANAGEMENT_ENDPOINTS_INCLUDE:health,metrics,prometheus}
  endpoint:
    health:
      show-details: ${SCM_MANAGEMENT_HEALTH_SHOW_DETAILS:never}
      probes:
        enabled: ${SCM_MANAGEMENT_HEALTH_PROBES_ENABLED:true}

springdoc:
  swagger-ui:
    disable-swagger-default-url: ${SCM_SWAGGER_DISABLE_DEFAULT_URL:true}
    path: ${SCM_SWAGGER_UI_PATH:/public/index.html}
  api-docs:
    path: ${SCM_SWAGGER_API_DOCS_PATH:/public/v3/api-docs}

logging:
  config: ${SCM_LOGBACK_CONFIG:classpath:logback-spring.xml}
  level:
    root: ${SCM_LOG_LEVEL_ROOT:INFO}
    ir.daneshrefah: ${SCM_LOG_LEVEL_APPLICATION:INFO}
    org.springframework: ${SCM_LOG_LEVEL_SPRING:INFO}
    org.springframework.security: ${SCM_LOG_LEVEL_SPRING_SECURITY:INFO}
    org.hibernate: ${SCM_LOG_LEVEL_HIBERNATE:WARN}
    org.hibernate.SQL: ${SCM_LOG_LEVEL_HIBERNATE_SQL:WARN}
    org.hibernate.type.descriptor.sql: ${SCM_LOG_LEVEL_HIBERNATE_SQL_BIND:WARN}
    org.hibernate.orm.jdbc.bind: ${SCM_LOG_LEVEL_HIBERNATE_JDBC_BIND:WARN}
    com.hazelcast: ${SCM_LOG_LEVEL_HAZELCAST:INFO}
    com.zaxxer.hikari: ${SCM_LOG_LEVEL_HIKARI:INFO}
    com.ibm.mq: ${SCM_LOG_LEVEL_IBM_MQ:WARN}

service:
  shahkar:
    baseUrl: ${SCM_SHAHKAR_BASE_URL:http://localhost:8088}
    tokenPath: ${SCM_SHAHKAR_TOKEN_PATH:/connect/token}
    inquiryPath: ${SCM_SHAHKAR_INQUIRY_PATH:/gov/1.0/ShahkarService}
    clientId: ${SCM_SHAHKAR_CLIENT_ID:}
    clientSecret: ${SCM_SHAHKAR_CLIENT_SECRET:}
    grant_Type: ${SCM_SHAHKAR_GRANT_TYPE:client_credentials}

scm:
  metadata:
    namespace: ${SCM_METADATA_NAMESPACE:}
    instance-id: ${SCM_METADATA_INSTANCE_ID:}
    time-zone: ${SCM_METADATA_TIME_ZONE:}

  deployment:
    service-version: ${SCM_SERVICE_VERSION:${VERSION:9.1.0}}

  application:
    version: ${SCM_APPLICATION_VERSION:${VERSION:9.1.0}}
    build: ${SCM_APPLICATION_BUILD:unknown}

  runtime: ${SCM_RUNTIME:standalone}

  cif:
    url: ${SCM_CIF_URL:http://localhost:8080/Service/}

  security:
    client:
      default-role: ${SCM_UAA_DEFAULT_CLIENT_ROLE:ROLE_CLIENT}
    key-store:
      name: ${SCM_UAA_JWT_KEY_STORE:config/keystore.p12}
      password: ${SCM_UAA_JWT_KEY_STORE_PASSWORD:password}
      alias: ${SCM_UAA_JWT_KEY_ALIAS:selfsigned}
    oauth:
      config:
        pwa:
          white-list-enabled: ${SCM_UAA_PWA_WHITE_LIST_ENABLED:false}
          activation:
            check-registry-token: ${SCM_UAA_PWA_CHECK_REGISTRY_TOKEN:true}
            otp-code-trails-count: ${SCM_OTP_MAX_ATTEMPTS:${SCM_UAA_PWA_OTP_CODE_TRIALS_COUNT:5}}
            otp-code-expiration-minutes: ${SCM_OTP_TTL:${SCM_UAA_PWA_OTP_CODE_EXPIRATION_MINUTES:2}}
            rate-limit-count: ${SCM_UAA_PWA_ACTIVATION_RATE_LIMIT_COUNT:5}
            rate-limit-blocked-time-minutes: ${SCM_UAA_PWA_ACTIVATION_BLOCKED_MINUTES:10}
          login:
            rate-limit-count: ${SCM_UAA_PWA_LOGIN_RATE_LIMIT_COUNT:5}
            rate-limit-blocked-time-minutes: ${SCM_UAA_PWA_LOGIN_BLOCKED_MINUTES:10}
            token-change-warn-period-days: ${SCM_UAA_PWA_TOKEN_CHANGE_WARN_DAYS:31}

  uaa:
    base-url: ${SCM_UAA_BASE_URL}
    issuer-url: ${SCM_UAA_BASE_URL}
    jwk-set-url: ${SCM_UAA_BASE_URL}/oauth2/jwks
    observation:
      channel:
        client-mappings: ${SCM_UAA_OBS_CHANNEL_CLIENT_MAPPINGS:NIB=ib,IB=ib,internet=ib,internet-banking=ib,PWA=mb,MB=mb,mobile=mb,SA=mb,super-app=mb}
      legacy:
        operations:
          login:
            operation-code: ${SCM_UAA_OBS_LEGACY_LOGIN_OPERATION_CODE:login}
            service-code: ${SCM_UAA_OBS_LEGACY_LOGIN_SERVICE_CODE:UAA_LOGIN}
          change-password:
            operation-code: ${SCM_UAA_OBS_LEGACY_CHANGE_PASSWORD_OPERATION_CODE:change-password}
            service-code: ${SCM_UAA_OBS_LEGACY_CHANGE_PASSWORD_SERVICE_CODE:UAA_CHANGE_PASSWORD}
          update-favorite-account:
            operation-code: ${SCM_UAA_OBS_LEGACY_UPDATE_FAVORITE_ACCOUNT_OPERATION_CODE:update-favorite-account}
            service-code: ${SCM_UAA_OBS_LEGACY_UPDATE_FAVORITE_ACCOUNT_SERVICE_CODE:UAA_UPDATE_FAVORITE_ACCOUNT}
          update-account-label:
            operation-code: ${SCM_UAA_OBS_LEGACY_UPDATE_ACCOUNT_LABEL_OPERATION_CODE:update-account-label}
            service-code: ${SCM_UAA_OBS_LEGACY_UPDATE_ACCOUNT_LABEL_SERVICE_CODE:UAA_UPDATE_ACCOUNT_LABEL}
    security:
      password:
        current-encoding-id: ${SCM_UAA_PASSWORD_CURRENT_ENCODING_ID:argon2id}
        legacy-default-matching-id: ${SCM_UAA_PASSWORD_LEGACY_DEFAULT_MATCHING_ID:legacy-md5}
    activation:
      nib:
        enabled: ${SCM_UAA_NIB_ACTIVATION_ENABLED:true}
    datasource:
      main:
        enabled: ${SCM_DB_ENABLED:true}
        url: ${SCM_DB_URL:${SCM_UAA_MAIN_DB_URL:jdbc:db2://localhost:50000/SCM}}
        username: ${SCM_DB_USERNAME:${SCM_UAA_MAIN_DB_USERNAME:scm}}
        password: ${SCM_DB_PASSWORD:${SCM_UAA_MAIN_DB_PASSWORD:}}
        driver-class-name: ${SCM_DB_DRIVER:${SCM_UAA_MAIN_DB_DRIVER:com.ibm.db2.jcc.DB2Driver}}
        max-connection: ${SCM_DB_MAX_CONNECTION:${SCM_UAA_MAIN_DB_MAX_CONNECTION:10}}
        default-schema: ${SCM_DB_SCHEMA:${SCM_UAA_MAIN_DB_SCHEMA:REF}}
      activation:
        enabled: ${SCM_UAA_ACTIVATION_DB_ENABLED:true}
        url: ${SCM_UAA_ACTIVATION_DB_URL:jdbc:db2://localhost:50000/SCM}
        username: ${SCM_UAA_ACTIVATION_DB_USERNAME:scm}
        password: ${SCM_UAA_ACTIVATION_DB_PASSWORD:}
        driver-class-name: ${SCM_UAA_ACTIVATION_DB_DRIVER:com.ibm.db2.jcc.DB2Driver}
        max-connection: ${SCM_UAA_ACTIVATION_DB_MAX_CONNECTION:10}
        default-schema: ${SCM_UAA_ACTIVATION_DB_SCHEMA:MBUAA}
    legacy:
      enabled: ${SCM_UAA_LEGACY_ENABLED:true}
      client-resolution:
        pwa-client-id: ${SCM_UAA_LEGACY_PWA_CLIENT_ID:PWA}
        mb-client-id: ${SCM_UAA_LEGACY_MB_CLIENT_ID:MB}
        super-app-client-id: ${SCM_UAA_LEGACY_SUPER_APP_CLIENT_ID:SA}
        nib-client-id: ${SCM_UAA_LEGACY_NIB_CLIENT_ID:NIB}
      refresh:
        client-id: ${SCM_UAA_LEGACY_REFRESH_CLIENT_ID:${SCM_UAA_LEGACY_SUPER_APP_CLIENT_ID:SA}}
        client-secret: ${SCM_UAA_LEGACY_REFRESH_CLIENT_SECRET:}
      pwa:
        cookie:
          enabled: ${SCM_UAA_LEGACY_PWA_COOKIE_ENABLED:true}
          name: ${SCM_UAA_LEGACY_PWA_COOKIE_NAME:__Host-SCM-PWA}
          max-age: ${SCM_UAA_LEGACY_PWA_COOKIE_MAX_AGE:PT1H}
          secure: ${SCM_UAA_LEGACY_PWA_COOKIE_SECURE:true}
          http-only: ${SCM_UAA_LEGACY_PWA_COOKIE_HTTP_ONLY:true}
          same-site: ${SCM_UAA_LEGACY_PWA_COOKIE_SAME_SITE:Lax}
          path: ${SCM_UAA_LEGACY_PWA_COOKIE_PATH:/}
    login:
      theme:
        default-theme: ${SCM_UAA_LOGIN_DEFAULT_THEME:default}
        clients:
          default:
            name: ${SCM_UAA_LOGIN_DEFAULT_CLIENT_NAME:default}
            display-name: ${SCM_UAA_LOGIN_DEFAULT_DISPLAY_NAME:SCM}
            css-class: ${SCM_UAA_LOGIN_DEFAULT_CSS_CLASS:theme-default}
          nib:
            name: ${SCM_UAA_LOGIN_NIB_CLIENT_NAME:nib}
            display-name: ${SCM_UAA_LOGIN_NIB_DISPLAY_NAME:NIB}
            css-class: ${SCM_UAA_LOGIN_NIB_CSS_CLASS:theme-nib}
            css-path: ${SCM_UAA_LOGIN_NIB_CSS_PATH:/assets/css/nib.css}
    cors:
      enabled: ${SCM_UAA_CORS_ENABLED:true}
      allow-credentials: ${SCM_UAA_CORS_ALLOW_CREDENTIALS:true}
      allowed-origin-patterns: ${SCM_SECURITY_CORS_ALLOWED_ORIGINS:${SCM_UAA_CORS_ALLOWED_ORIGIN_PATTERNS:}}
      allowed-methods: ${SCM_UAA_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
      allowed-headers: ${SCM_UAA_CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Correlation-Id,AppVersion,Appversion,app_version,app-version,APP_VERSION,APPVERSION,x-otp-code,AccessParameter,Signature,RegistryToken}
      exposed-headers: ${SCM_UAA_CORS_EXPOSED_HEADERS:Set-Cookie,X-Correlation-Id}
      path-patterns: ${SCM_UAA_CORS_PATH_PATTERNS:/**}
  cache:
    client:
      distributed: ${SCM_CACHE_CLIENT_DISTRIBUTED:${SCM_CACHE_DISTRIBUTED:false}}
      default-type: ${SCM_CACHE_CLIENT_DEFAULT_TYPE:remote}
      remote:
        cluster-name: ${SCM_CACHE_REMOTE_CLUSTER_NAME:${SCM_CACHE_CLUSTER_NAME:scm-cache}}
        addresses: ${SCM_CACHE_REMOTE_ADDRESSES:${SCM_CACHE_ADDRESS:127.0.0.1:5701}}
      local:
        ttl: ${SCM_CACHE_LOCAL_TTL:0s}
        maximum-size: ${SCM_CACHE_LOCAL_MAXIMUM_SIZE:10000}
      near:
        enabled: ${SCM_CACHE_NEAR_ENABLED:true}
        maximum-size: ${SCM_CACHE_NEAR_MAXIMUM_SIZE:10000}
        invalidate-on-change: ${SCM_CACHE_NEAR_INVALIDATE_ON_CHANGE:true}
        in-memory-format: ${SCM_CACHE_NEAR_IN_MEMORY_FORMAT:OBJECT}
      caches:
        session_cache:
          type: ${SCM_CACHE_SESSION_TYPE:near}
          remote-name: ${SCM_CACHE_SESSION_REMOTE_NAME:session_cache}
          maximum-size: ${SCM_CACHE_SESSION_MAXIMUM_SIZE:10000}
        user_cache:
          type: ${SCM_CACHE_USER_TYPE:near}
          remote-name: ${SCM_CACHE_USER_REMOTE_NAME:user_cache}
          maximum-size: ${SCM_CACHE_USER_MAXIMUM_SIZE:10000}
        jwt:jti:
          type: ${SCM_CACHE_JWT_JTI_TYPE:remote}
          remote-name: ${SCM_CACHE_JWT_JTI_REMOTE_NAME:jwt:jti}

  otp:
    ttl: ${SCM_OTP_TTL:${SCM_OTP_TTL_MINUTES:1}}
    time-to-live-minutes: ${SCM_OTP_TTL:${SCM_OTP_TTL_MINUTES:1}}
    channel:
      id: ${SCM_OTP_CHANNEL_ID:1}
      channelCode: ${SCM_OTP_CHANNEL_CODE:OTP}
      jcaAlgorithm: ${SCM_OTP_JCA_ALGORITHM:RSA}
      storeKey: ${SCM_OTP_STORE_KEY:storeKey-test}
      password: ${SCM_OTP_STORE_PASSWORD:}
    jms:
      avacas:
        hostName: ${SCM_OTP_AVACAS_HOST:localhost}
        port: ${SCM_OTP_AVACAS_PORT:1717}
        channel: ${SCM_OTP_AVACAS_CHANNEL:SYSTEM.ADMIN.SVRCONN}
        queueManager: ${SCM_OTP_AVACAS_QUEUE_MANAGER:}
        username: ${SCM_OTP_AVACAS_USERNAME:}
        password: ${SCM_OTP_AVACAS_PASSWORD:}
        sendQueueName: ${SCM_OTP_AVACAS_SEND_QUEUE:AVACAS2CM_R}
        receiverQueueName: ${SCM_OTP_AVACAS_RECEIVER_QUEUE:AVACAS2CM_L}

  notification:
    enabled: ${SCM_NOTIFICATION_ENABLED:false}
    sms:
      enabled: ${SCM_NOTIFICATION_SMS_ENABLED:false}
      ibm-mq:
        queue-manager: ${SCM_NOTIFICATION_MQ_QUEUE_MANAGER:}
        channel: ${SCM_NOTIFICATION_MQ_CHANNEL:}
        username: ${SCM_NOTIFICATION_MQ_USERNAME:}
        password: ${SCM_NOTIFICATION_MQ_PASSWORD:}
        port: ${SCM_NOTIFICATION_MQ_PORT:1414}
        host: ${SCM_NOTIFICATION_MQ_HOST:localhost}

  captcha:
    border:
      enabled: ${SCM_CAPTCHA_BORDER_ENABLED:true}
      color: ${SCM_CAPTCHA_BORDER_COLOR:200,200,200}
      thickness: ${SCM_CAPTCHA_BORDER_THICKNESS:1}
    noise:
      color: ${SCM_CAPTCHA_NOISE_COLOR:124,133,174}
    items:
      login:
        path: ${SCM_CAPTCHA_LOGIN_PATH:/public/login/captcha}
        session:
          key: ${SCM_CAPTCHA_LOGIN_SESSION_KEY:loginCaptchaKey}
          date: ${SCM_CAPTCHA_LOGIN_SESSION_DATE:loginCaptchaDate}
        background:
          color-from: ${SCM_CAPTCHA_LOGIN_BACKGROUND_FROM:81,89,130}
          color-to: ${SCM_CAPTCHA_LOGIN_BACKGROUND_TO:81,89,130}
        text-producer:
          font:
            color: ${SCM_CAPTCHA_LOGIN_FONT_COLOR:255,255,255}

  jms:
    logout:
      enabled: ${SCM_LOGOUT_JMS_ENABLED:false}
      host: ${SCM_LOGOUT_JMS_HOST:localhost}
      port: ${SCM_LOGOUT_JMS_PORT:1414}
      channel: ${SCM_LOGOUT_JMS_CHANNEL:}
      queueManager: ${SCM_LOGOUT_JMS_QUEUE_MANAGER:}
      username: ${SCM_LOGOUT_JMS_USERNAME:}
      password: ${SCM_LOGOUT_JMS_PASSWORD:}
      topic: ${SCM_LOGOUT_JMS_TOPIC:SUA/LOGOUT}

  super-app:
    session-ttl: ${SCM_SUPER_APP_SESSION_TTL:3600000}

  observation:
    http:
      server:
        span-name: ${SCM_OBS_HTTP_SERVER_SPAN_NAME:uaa.http.request}
    trace:
      aspect:
        enabled: ${SCM_UAA_AUTH_TRACE_ASPECT_ENABLED:true}
    audit:
      enabled: ${SCM_OBS_AUDIT_ENABLED:true}
