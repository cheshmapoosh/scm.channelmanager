<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>JWT Decoder</title>
    <link
            href="../static/css/jwt.css"
            rel="stylesheet"
            type="text/css"
            media="all"
            th:href="@{/css/jwt.css}"
    />
</head>
<body>
<div class="container">
    <div class="form-box">
        <div class="form-header">
            <div class="logo">
                <img
                        src="../static/images/logo.webp"
                        alt="logo"
                        th:src="@{/images/logo.webp}"
                />
            </div>
            <h2 class="title">توکن را وارد کنید</h2>
        </div>
        <form th:action="@{/public/tools/jwt}" th:method="post">
            <div class="form-container">
                <div class="form-row">
              <textarea
                      class="form-control"
                      id="inputToken"
                      th:text="*{encodedValue}"
                      name="encodedValue"
                      placeholder="Enter JWT value"
                      rows="5"
                      required
                      autofocus
              ></textarea>
                </div>
                <div class="form-row">
                    <button class="decode-btn" type="submit">
                        Decode
                    </button>
                </div>
                <div class="form-row">
              <textarea
                      class="form-control"
                      id="outputToken"
                      th:text="*{decodedValue}"
                      rows="10"
                      placeholder="Plain JWT"
              ></textarea>
                </div>
            </div>
        </form>
    </div>
</div>
</body>
</html>
