<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta
            name="viewport"
            content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title  th:text="' سامانه' + ${panelName}"></title>
    <th:block th:if="${client_id != 'SCM'}">
        <link
                href="../static/css/ibnLogin.css"
                rel="stylesheet"
                type="text/css"
                media="all"
                th:href="@{/css/ibnLogin.css}"
        />
    </th:block>
    <th:block th:if="${client_id == 'SCM'}">
        <link
                href="../static/css/scmLogin.css"
                rel="stylesheet"
                type="text/css"
                media="all"
                th:href="@{/css/scmLogin.css}"
        />
    </th:block>
</head>
<body>
<div class="container">
    <div class="form-wrapper">
        <div class="form-header">
            <div class="logo">
                <img
                        src="../static/images/logo.webp"
                        alt="logo"
                        th:src="@{/images/logo.webp}"
                />
            </div>
            <div class="title">
                <h3 class="header-text" th:if="${!isStepTwoRequired}">
                        ورود به سامانه  <span th:text="${panelName}"></span>
                </h3>
                <h3 class="header-text" th:if="${isStepTwoRequired}">
                     کد تایید را وارد کنید
                </h3>
            </div>
        </div>
       <div class="form-message"   th:text="${formMessage} ? ${formMessage} :'' "></div>
        <form class="form-signin" method="post" action="/login">
            <div class="form-content">
                <div class="form-row" th:if="${!isStepTwoRequired}">
                    <input
                            class="input"
                            type="text"
                            id="username"
                            name="username"
                            placeholder="نام کاربری"
                            required
                            autofocus
                    />
                </div>
                <div class="form-row" th:if="${!isStepTwoRequired}">
                    <input
                            class="input"
                            type="password"
                            id="password"
                            name="password"
                            placeholder="رمز عبور"
                            required
                    />
                </div>
                <div class="form-row" th:if="${isStepTwoRequired}">
                    <input
                            class="input"
                            type="password"
                            id="claim"
                            name="claim_code"
                            placeholder="کد تایید"
                            required
                    />
                </div>
                <input
                        type="hidden"
                        th:name="${csrf_name}"
                        th:value="${csrf_value}"
                />
                <input type="hidden" name="is_step_two" th:value="${false}" />
                <input type="hidden" name="client_id" th:value="${client_id}" />
                <div class="form-row">
                    <button
                            class="submit-btn"
                            type="submit"
                            th:if="${!isStepTwoRequired}"
                            th:text="${!isStepTwoRequired} ? ' دریافت کد تایید' : 'ورود'"
                    />
                </div>
            </div>
        </form>
    </div>
</div>
</body>
</html>
