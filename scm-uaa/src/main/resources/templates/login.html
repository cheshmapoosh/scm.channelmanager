<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title th:text="'سامانه ' + ${client_title}"></title>
    <link th:href="@{/assets/css/login.css}" rel="stylesheet" type="text/css" />
    <th:block
      th:if="${client_id}"
      th:with="dynamicCssPath=@{/assets/css/__${client_id+'.css'}__}"
    >
      <link th:href="${dynamicCssPath}" rel="stylesheet" type="text/css" />
    </th:block>
  </head>
  <body>
    <div class="container">
      <div class="form-wrapper">
        <div class="form-header">
          <div class="logo">
            <img th:src="@{/assets/images/logo.webp}" alt="logo" />
          </div>
          <div class="title">
            <div class="header-text panel-title">
              ورود به سامانه <span th:text="${client_title}"></span>
            </div>
            <div class="header-text" th:if="${isStepTwoRequired}">
              کد تایید را وارد کنید
            </div>
          </div>
        </div>
        <div
          class="form-message"
          th:text="${errorMessage} ? ${errorMessage} :'' "
        ></div>
        <form class="form-signin" method="post" action="/login">
          <div class="form-content">
            <div class="form-row" th:if="${!isStepTwoRequired}">
              <input
                class="input"
                type="text"
                id="username"
                name="username"
                placeholder="نام کاربری"
                required
                autofocus
              />
            </div>
            <div class="form-row" th:if="${!isStepTwoRequired}">
              <input
                class="input"
                type="password"
                id="password"
                name="password"
                placeholder="رمز عبور"
                required
              />
            </div>
            <div class="form-row" th:if="${isStepTwoRequired}">
              <input
                class="input"
                type="password"
                id="claim"
                name="claim_code"
                placeholder="کد تایید"
                required
              />
            </div>
            <input
              type="hidden"
              th:name="${csrf_name}"
              th:value="${csrf_value}"
            />
            <input type="hidden" name="is_step_two" th:value="${false}" />
            <input type="hidden" name="client_id" th:value="${client_id}" />

            <div class="btn-container">
              <button
                class="submit-btn"
                type="submit"
                th:text="${!isStepTwoRequired} ? 'ورود' : 'ارسال کد تایید' "
              ></button>
              <button
                class="sms-btn"
                type="submit"
                th:if="${authenticationMethod == 'SMS'}"
              >
                ارسال پیامک
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
