plugins {
    id 'ir.daneshrefah.scm.java-library-conventions'
    id "org.springframework.boot" version'3.1.2'
    id 'java'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

compileJava.options.encoding = 'UTF-8'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named("bootJar") {
    mainClass = 'ir.daneshrefah.scm.uaa.UAAServerApplication'
    archiveClassifier = 'boot'

}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation "org.springframework.boot:spring-boot-starter-oauth2-authorization-server"
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    runtimeOnly 'com.ibm.db2:jcc'
    runtimeOnly 'mysql:mysql-connector-java:8.0.33'
    compileOnly 'org.projectlombok:lombok'
    implementation 'org.mapstruct:mapstruct:1.5.3.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.3.Final'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    annotationProcessor 'org.projectlombok:lombok:1.18.28'
    api project(':scm-common-data')
    api project(':scm-uaa-common')
    api project(':scm-utils')
    api project(':scm-cache-client')
    api project(':scm-common')
//    api project(':scm-notification')
    api project(':scm-notification-client')
    api project(':scm-common-error')
    implementation group: 'org.springdoc', name: 'springdoc-openapi-starter-webmvc-ui', version: '2.1.0'
    api project(':scm-logging')

}

test{
    exclude  'ir/daneshrefah/scm/uaa/*'
}
