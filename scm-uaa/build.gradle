plugins {
    id 'ir.daneshrefah.scm.java-library-conventions'
    id 'java'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

compileJava.options.encoding = 'UTF-8'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named("bootJar") {
    mainClass = 'ir.daneshrefah.scm.uaa.UAAServerApplication'
    archiveClassifier = 'boot'

}
bootJar {
    enabled = true
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation "org.springframework.boot:spring-boot-starter-oauth2-authorization-server"
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    implementation 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    api project(':scm-common-data')
    api project(':scm-uaa-common')
    api project(':scm-utils')
    api project(':scm-cache-client')
    api project(':scm-common')
//    api project(':scm-notification')
    api project(':scm-notification-client')
    api project(':scm-common-error')
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui'
    implementation project(':scm-logging')
    implementation 'org.mapstruct:mapstruct'
    annotationProcessor 'org.mapstruct:mapstruct-processor'
    implementation 'org.apache.commons:commons-collections4'

}

test{
    exclude  'ir/daneshrefah/scm/uaa/*'
}
