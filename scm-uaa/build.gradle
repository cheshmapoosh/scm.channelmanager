plugins {
    id 'ir.daneshrefah.scm.java-library-conventions'
    id 'java'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

compileJava.options.encoding = 'UTF-8'

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.named("bootJar") {
    mainClass = 'ir.daneshrefah.scm.uaa.UAAServerApplication'
    archiveClassifier = ''
}
bootJar {
    enabled = true
    version = parent.version
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation "org.springframework.boot:spring-boot-starter-oauth2-authorization-server"
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    runtimeOnly 'com.ibm.db2:db2jcc'
    runtimeOnly 'com.ibm.db2:db2jcc_license_cisuz'
    runtimeOnly 'com.ibm.db2.jcc:db2jcc:db2jcc4'
    implementation 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    api project(':scm-common-data')
    api project(':scm-uaa-common')
    api project(':scm-utils')
    api project(':scm-cache-starter')
    api project(':scm-common')
//    api project(':scm-notification')
    implementation project(':scm-observation-starter')
    implementation project(':scm-common-log')
    api project(':scm-notification-client')
    api project(':scm-common-error')
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui'
    implementation 'org.mapstruct:mapstruct'
    annotationProcessor 'org.mapstruct:mapstruct-processor'
    implementation 'org.apache.commons:commons-collections4'
    api 'com.ibm.mq:com.ibm.mq.allclient:9.4.1.0'
    api 'com.ibm.mq:com.ibm.mq.jakarta.client:9.4.1.0'
    implementation ('org.codehaus.janino:janino')
}

test{
    exclude  'ir/daneshrefah/scm/uaa/*'
}
