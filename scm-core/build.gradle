/*
 * This file was generated by the Gradle 'init' task.
 *
 * This project uses @Incubating APIs which are subject to change.
 */

plugins {
    id 'ir.daneshrefah.scm.java-library-conventions'
}


dependencies {
    implementation 'jakarta.validation:jakarta.validation-api'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'jakarta.validation:jakarta.validation-api'
    implementation 'org.hibernate.validator:hibernate-validator'
    compileOnly 'org.projectlombok:lombok'
    api 'org.apache.camel.springboot:camel-spring-boot-starter'
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.mapstruct:mapstruct'
    annotationProcessor 'org.mapstruct:mapstruct-processor'
    implementation 'org.projectlombok:lombok'
    api 'org.apache.camel.springboot:camel-core-starter'
    api 'org.apache.camel.springboot:camel-rest-starter'
    api 'org.apache.camel.springboot:camel-direct-starter'
    api 'org.apache.camel.springboot:camel-netty-starter'
    api 'org.apache.camel.springboot:camel-netty-http-starter'
    api 'org.apache.camel.springboot:camel-jackson-starter'
//    api 'org.apache.camel.springboot:camel-opentelemetry-starter'
    api 'org.apache.camel.springboot:camel-bean-validator-starter'
    api 'org.apache.camel.springboot:camel-servlet-starter'
    api 'org.apache.camel.springboot:camel-resilience4j-starter'
    api 'org.apache.camel.springboot:camel-rest-openapi-starter'
    api 'org.apache.camel:camel-hazelcast'
    api 'org.apache.camel:camel-openapi-java'
    api 'com.bucket4j:bucket4j_jdk17-core'
    api 'org.springframework.boot:spring-boot-starter-web'
    implementation "org.projectlombok:lombok"
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui'
    implementation 'org.apache.commons:commons-collections4'
    implementation 'org.springframework.boot:spring-boot-starter-freemarker'
    implementation("org.springframework.boot:spring-boot-starter-thymeleaf")
    implementation 'org.apache.camel.springboot:camel-jsonpath-starter'
    implementation 'org.apache.commons:commons-text'

    api project(':scm-common-data')
    compileOnly project(':scm-provider-task')
    api project(':scm-plugin-nab')
    api project(':scm-plugin-pichack')
    api project(':scm-plugin-sayad')
    api project(':scm-plugin-scm')
    api project(':scm-plugin-mock')
    api project(':scm-common-error')
    api project(':scm-otp-client')
    implementation project(':scm-uaa-starter')
    implementation project(':scm-observation-starter')
    implementation 'io.opentelemetry:opentelemetry-api'
    api project(':scm-plugin-camel-components')

    testImplementation 'org.junit.jupiter:junit-jupiter-api'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine'
    testImplementation 'org.apache.camel:camel-test-spring-junit5'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.mockito:mockito-core'
    api project(':scm-cache-starter')
    implementation 'com.github.mfathi91:persian-date-time:4.2.1'
}
