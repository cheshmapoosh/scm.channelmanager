/*
 * This file was generated by the Gradle 'init' task.
 *
 * This project uses @Incubating APIs which are subject to change.
 */

plugins {
    id 'ir.daneshrefah.scm.java-library-conventions'
    id "io.freefair.lombok" version "8.0.1"
}

dependencies {
    implementation group: 'jakarta.validation', name: 'jakarta.validation-api', version: '3.0.2'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.hibernate:hibernate-validator:6.2.0.Final'
    compileOnly group: 'org.projectlombok', name: 'lombok', version: '0.11.0'
    api 'org.apache.camel.springboot:camel-spring-boot-starter'
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.mapstruct:mapstruct:1.5.3.Final'
    annotationProcessor 'org.mapstruct:mapstruct-processor:1.5.3.Final'
    implementation 'org.projectlombok:lombok:1.18.22'
    api 'org.apache.camel.springboot:camel-core-starter'
    api 'org.apache.camel.springboot:camel-rest-starter'
    api 'org.apache.camel.springboot:camel-direct-starter'
    api 'org.apache.camel.springboot:camel-netty-starter'
    api 'org.apache.camel.springboot:camel-netty-http-starter'
    api 'org.apache.camel.springboot:camel-jackson-starter'
    api 'org.apache.camel:camel-beanstalk:3.16.0'
//    implementation 'com.fasterxml.jackson.core:jackson-databind:2.14.2'
//    api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.14.2'
    api 'org.springframework.boot:spring-boot-starter-web'
    implementation "org.projectlombok:lombok:1.18.20"
    annotationProcessor 'org.projectlombok:lombok:1.18.20'
//    implementation 'com.fasterxml.jackson.module:jackson-module-jsonSchema-jakarta'

    // JUnit 5
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'

    // Mockito
    testImplementation 'org.mockito:mockito-core:4.0.0'

//    implementation 'ir.daneshrefah.scm.uaa:uaa-client:0.0.1-SNAPSHOT'

//    implementation 'org.openapi4j:openapi-core:1.0.7'
    implementation group: 'io.swagger.core.v3', name: 'swagger-core', version: '2.2.15'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.2.0'

    implementation 'com.googlecode.json-simple:json-simple:1.1.1'
    api project(':scm-common-data')
    //    api project(':scm-common')
    api project(':scm-plugin-nab')
    api project(':scm-plugin-pichack')
    api project(':scm-plugin-sayad')
    api project(':scm-plugin-scm')
    api project(':scm-plugin-mock')
    api project(':scm-common-error')
    api project(':scm-task')
    api project(':scm-logging')
}
