name: scm

x-scm-common: &scm-common
  image: reg.daneshrefah.ir/modern-banking/scm-app:${SCM_IMAGE_TAG:-9.0.1-b0504T1448}
  pull_policy: if_not_present
  restart: unless-stopped
  networks:
    - scm
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

services:
  scm-config:
    <<: *scm-common
    container_name: scm-config-container
    volumes:
      - /home/scm/docker/config/config-repo-server:/home/scm/docker/config/config-repo-server
      - /home/scm/docker/config/config-repo:/home/scm/docker/config/config-repo
    ports:
      - "8888:8080"
      - "5088:5088"
    environment:
      VERSION: ${SCM_VERSION:-9.0.1}
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx2g}
      SPRING_APPLICATION_NAME: scm-config
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CLOUD_CONFIG_IMPORT_CHECK_ENABLED: "false"
      JDWP_OPTS: >-
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5088

  scm-cache:
    <<: *scm-common
    container_name: scm-cache-container
    depends_on:
      scm-config:
        condition: service_started
    ports:
      - "8080:8080"
      - "5701:5701"
      - "5702:5702"
      - "5703:5703"
      - "5080:5080"
    environment:
      VERSION: ${SCM_VERSION:-9.0.1}
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx2g}
      SPRING_APPLICATION_NAME: scm-cache
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CONFIG_IMPORT: "configserver:http://scm-config:8080/config"
      SPRING_CLOUD_CONFIG_URI: "http://scm-config:8080/config"
      SPRING_CLOUD_CONFIG_USERNAME: scm
      SPRING_CLOUD_CONFIG_PASSWORD: scm
      JDWP_OPTS: >-
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5080

  scm-uaa:
    <<: *scm-common
    container_name: scm-uaa-container
    depends_on:
      scm-config:
        condition: service_started
    ports:
      - "8000:8000"
      - "5000:5000"
    environment:
      VERSION: ${SCM_VERSION:-9.0.1}
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx2g}
      SPRING_APPLICATION_NAME: scm-uaa
      SPRING_PROFILES_ACTIVE: dev
      SPRING_CONFIG_IMPORT: "configserver:http://scm-config:8080/config"
      SPRING_CLOUD_CONFIG_URI: "http://scm-config:8080/config"
      SPRING_CLOUD_CONFIG_USERNAME: scm
      SPRING_CLOUD_CONFIG_PASSWORD: scm
      JDWP_OPTS: >-
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5000
      SCM_SWAGGER_TARGET_HOST: 10.10.4.125


  ib-web:
    <<: *scm-common
    container_name: scm-ib-container
    depends_on:
      scm-config:
        condition: service_started
    ports:
      - "8082:8082"
      - "8086:8086"
      - "5082:5082"
    environment:
      VERSION: ${SCM_VERSION:-9.0.1}
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx2g}
      SPRING_APPLICATION_NAME: scm-web
      SPRING_PROFILES_ACTIVE: ib4dev
      SPRING_CONFIG_IMPORT: "configserver:http://scm-config:8080/config"
      SPRING_CLOUD_CONFIG_URI: "http://scm-config:8080/config"
      SPRING_CLOUD_CONFIG_USERNAME: scm
      SPRING_CLOUD_CONFIG_PASSWORD: scm
      JDWP_OPTS: >-
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5082
      SCM_SWAGGER_TARGET_HOST: 10.10.4.125

  mb-web:
    <<: *scm-common
    container_name: scm-mb-container
    depends_on:
      scm-config:
        condition: service_started
    ports:
      - "8084:8082"
      - "8088:8086"
      - "5084:5082"
    environment:
      VERSION: ${SCM_VERSION:-9.0.1}
      JAVA_OPTS: ${JAVA_OPTS:--Xms512m -Xmx2g}
      SPRING_APPLICATION_NAME: scm-web
      SPRING_PROFILES_ACTIVE: mb4dev
      SPRING_CONFIG_IMPORT: "configserver:http://scm-config:8080/config"
      SPRING_CLOUD_CONFIG_URI: "http://scm-config:8080/config"
      SPRING_CLOUD_CONFIG_USERNAME: scm
      SPRING_CLOUD_CONFIG_PASSWORD: scm
      JDWP_OPTS: >-
        -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5082
      SCM_SWAGGER_TARGET_HOST: 10.10.4.125

networks:
  scm:
    name: scm
    driver: bridge