apiVersion: v1
kind: Service
metadata:
  name: {{ include "scm-cache.fullname" . }}-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "scm-cache.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http

  selector:
    {{- include "scm-cache.selectorLabels" . | nindent 4 }}

---

apiVersion: v1
kind: Service
metadata:
  name: {{ include "scm-cache.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "scm-cache.labels" . | nindent 4 }}
spec:
  type: {{ .Values.scm_cache_service.type }}
  clusterIP: {{ .Values.scm_cache_service.clusterIP }}
  ports:
    - port: {{ .Values.scm_cache_service.port }}
      targetPort: {{ .Values.scm_cache_service.port }}
      protocol: TCP
      name: scm-cache
      appProtocol: tcp

  selector:
    {{- include "scm-cache.selectorLabels" . | nindent 4 }}