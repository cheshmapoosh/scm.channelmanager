apiVersion: v1
kind: Service
metadata:
  name: {{ include "scm-cache.fullname" . }}
  labels:
    {{- include "scm-cache.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
      protocol: TCP
      name: hazelcast
  selector:
    {{- include "scm-cache.selectorLabels" . | nindent 4 }}