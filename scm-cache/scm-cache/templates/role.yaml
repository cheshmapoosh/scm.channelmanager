apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: scm-cache-role
rules:
  - apiGroups: [""]
    resources: ["pods", "endpoints", "nodes", "services", "statefulsets"]
    verbs: ["get", "list", "watch"]

  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list"]
