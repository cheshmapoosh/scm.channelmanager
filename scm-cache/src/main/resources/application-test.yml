hazelcast:
  config:
    instance-name: my-instance3
    clustername: dev3
    properties:
      hazelcast:
        socket:
          bind:
            any: true
        logging:
          type: slf4j
        partition:
          table:
            send:
              interval: 15
          count: 271
    network-config:
      port: 5701
      port-auto-increment: true
      port-count: 100
      reuse-address: true
      join:
        multicast-config:
          enabled: false
        aws-config:
          enabled: false
        tcp-ip-config:
          enabled: true
          required-member: 192.168.180.107
          members: 192.168.180.107
          connection-timeout-seconds: 5
    flake-id-generator-configs:
      default:
        prefetch-count: 10000
        prefetch-validity-millis: 600000
        node-id-offset: 0
        statistics-enabled: true


springdoc:
  api-docs:
    enabled: true
  packages-to-scan: ir.daneshrefah.scm.cache.rest
server:
  port: 8080



