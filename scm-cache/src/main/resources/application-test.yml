

spring:
  datasource:
    url: jdbc:db2://10.15.27.82:446/DSNALOC
    username: casadm
    password: a
    driver-class-name: com.ibm.db2.jcc.DB2Driver
  config:
    import: 'optional:configserver:'
  cloud:
    config:
      username: scm
      password: scm
      name: cache
      enabled: true
      uri: http://scm-config.daneshrefah.ir/config

  jpa:
