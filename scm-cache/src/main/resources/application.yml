server:
  port: ${SERVER_PORT:8080}

spring:
  main:
    banner-mode: off
  profiles:
    active: dev
  application:
    name: scm-cache

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
        add-additional-paths: true
      group:
        liveness:
          include: livenessState,scmCacheHazelcastLiveness
        readiness:
          include: readinessState,scmCacheHazelcast

scm:
  cache:
    health:
      hazelcast:
        minimum-cluster-size: ${SCM_CACHE_HEALTH_MIN_CLUSTER_SIZE:1}
        element-risk:
          default-warning-ratio: ${SCM_CACHE_ELEMENT_WARNING_RATIO:0.80}
          default-critical-ratio: ${SCM_CACHE_ELEMENT_CRITICAL_RATIO:0.90}
          elements:
            user_cache:
              warning-ratio: 0.80
              critical-ratio: 0.90
