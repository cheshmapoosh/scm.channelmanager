SPRING_CLOUD_CONFIG_URI: http://10.10.4.125:8888/config
SPRING_CLOUD_CONFIG_USERNAME: scm
SPRING_CLOUD_CONFIG_PASSWORD: scm
spring:
  config:
    import: 'optional:configserver:'
    activate:
      on-profile: dev
  cloud:
    config:
      username: ${SPRING_CLOUD_CONFIG_USERNAME}
      password: ${SPRING_CLOUD_CONFIG_PASSWORD}
      name: cache
      enabled: true
      uri: ${SPRING_CLOUD_CONFIG_URI}