spring:
  cloud:
    config:
      enabled: false

SCM_ENV: dev
SCM_APPLICATION_NAME: scm-cache
SCM_INSTANCE_ID: local-scm-cache
SCM_SERVER_PORT: ${SERVER_PORT:8080}

SCM_DB_URL: jdbc:db2://10.15.27.82:446/DSNALOC
SCM_DB_USERNAME: casadm
SCM_DB_PASSWORD: ${SCM_DEV_DB_PASSWORD:a}
SCM_DB_DRIVER: com.ibm.db2.jcc.DB2Driver
SCM_DB_SCHEMA: REF
SCM_DB_MAX_CONNECTION: 10
