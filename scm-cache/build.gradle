plugins {
    id 'ir.daneshrefah.scm.java-library-conventions'
    id 'java'
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

bootJar {
    enabled = true
    version = parent.version
}

tasks.named("bootJar") {
    mainClass = 'ir.daneshrefah.scm.cache.CacheServerApplication'
    archiveClassifier = ''

}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'com.hazelcast:hazelcast-spring'
    runtimeOnly 'com.ibm.db2:db2jcc'
    runtimeOnly 'com.ibm.db2:db2jcc_license_cisuz'
    runtimeOnly 'com.ibm.db2.jcc:db2jcc:db2jcc4'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    api project(':scm-uaa-common')
    implementation 'org.springframework.security:spring-security-core'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    api 'com.bucket4j:bucket4j_jdk17-core'
    api 'com.bucket4j:bucket4j_jdk17-hazelcast'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation ('org.codehaus.janino:janino')
}