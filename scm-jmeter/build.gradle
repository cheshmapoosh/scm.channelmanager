plugins {
    id 'java'
}

version = parent.version

tasks.named('jar') {
    archiveClassifier = ""
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.apache.jmeter:ApacheJMeter_core:5.6.3'      // JMeter core libraries
    implementation 'org.apache.jmeter:jorphan:5.6.3'   // JMeter utilities
    testImplementation platform('org.apache.jmeter:ApacheJMeter_bom:5.6.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

test {
    useJUnitPlatform()
}