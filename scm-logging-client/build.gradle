 *
 * This project uses @Incubating APIs which are subject to change.
 */

plugins {
    id 'ir.daneshrefah.scm.java-library-conventions'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    compileOnly 'org.springframework.boot:spring-boot-starter-web'
    implementation'org.springframework.boot:spring-boot-starter-data-jpa'
    compileOnly 'org.springframework.boot:spring-boot-autoconfigure'
    api 'io.opentelemetry:opentelemetry-api'
    api 'io.opentelemetry:opentelemetry-sdk'
    api 'io.opentelemetry:opentelemetry-exporter-logging'
    compileOnly 'jakarta.servlet:jakarta.servlet-api'
    compileOnly 'org.springframework:spring-context'
    implementation 'ch.qos.logback:logback-classic'
    implementation 'ch.qos.logback:logback-core'
    api project(':scm-uaa-common')
    api project(':scm-common-log')
    implementation 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    implementation 'org.mapstruct:mapstruct'
    annotationProcessor 'org.mapstruct:mapstruct-processor'
    implementation 'org.apache.camel.springboot:camel-opentelemetry-starter'
    implementation("org.apache.commons:commons-lang3:3.17.0")
}