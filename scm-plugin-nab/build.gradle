plugins {
    id 'ir.daneshrefah.scm.java-library-conventions'
}

dependencies {
    compileOnly 'org.springframework:spring-jdbc'
    implementation 'org.apache.camel:camel-netty'
    implementation 'org.apache.camel.springboot:camel-netty-starter'
    implementation 'org.apache.camel:camel-bean'
    implementation 'org.apache.camel.springboot:camel-timer-starter'
    implementation 'org.apache.camel.springboot:camel-direct-starter'
    api project(":scm-plugin-api")
    implementation 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
}