plugins {
    id 'ir.daneshrefah.scm.java-library-conventions'
}

dependencies {
    compileOnly 'jakarta.servlet:jakarta.servlet-api'
    compileOnly "org.springframework:spring-webmvc"
    implementation 'com.fasterxml.jackson.module:jackson-module-jsonSchema:2.14.2'
    api 'org.apache.camel.springboot:camel-jackson-starter'
    api 'org.apache.camel.springboot:camel-json-validator-starter'
    api 'org.apache.camel.springboot:camel-core-starter'
    api 'org.apache.camel.springboot:camel-http-starter'
    implementation 'org.reflections:reflections:0.10.2'
//    api 'ir.daneshrefah.scm.uaa:uaa-client:0.0.1-SNAPSHOT'
    api project(':scm-common')
    api project(':scm-utils')
    api project(':scm-uaa-client')
    api project(':scm-logging')
}