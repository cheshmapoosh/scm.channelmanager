/*
 * This file was generated by the Gradle 'init' task.
 *
 * This project uses @Incubating APIs which are subject to change.
 */

plugins {
    // Apply the java Plugin to add support for Java.
    id 'java'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenLocal()
    mavenCentral()
}

dependencies {
    constraints {
        // Define dependency versions as constraints
        implementation 'org.apache.commons:commons-text:1.9'
    }
    implementation platform("org.springframework.boot:spring-boot-dependencies:3.1.1")
    implementation platform("org.apache.camel.springboot:camel-spring-boot-bom:4.0.0-RC1")
    implementation('org.apache.commons:commons-lang3:3.12.0')
    implementation("ir.daneshrefah.uaa:uaa-common:1.0.0")
//    implementation platform('org.apache.camel.springboot:camel-spring-boot-starter:4.0.0-RC1')
}

testing {
    suites {
        // Configure the built-in test suite
        test {
            // Use JUnit Jupiter test framework
            useJUnitJupiter('5.8.1')
        }
    }
}
