plugins {
    id 'ir.daneshrefah.scm.java-library-conventions'
}

group = 'ir.daneshrefah.scm.plugin.camel'
version = parent.version

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.apache.camel.springboot:camel-spring-boot-starter'
    implementation 'org.apache.camel.springboot:camel-netty-starter'

    implementation 'org.apache.httpcomponents:httpclient'
    implementation 'org.apache.commons:commons-text'
    implementation 'org.apache.camel:camel-groovy:4.14.2'
    implementation 'org.apache.groovy:groovy-json:4.0.29'
    compileOnly project(':scm-utils')


    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.apache.camel:camel-test-spring-junit5'
}

tasks.named('test') {
    useJUnitPlatform()
}
